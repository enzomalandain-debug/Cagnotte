<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Cagnotte</title>
<meta name="theme-color" content="#1C4C9A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cagnotte">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one-column phone app. Lift-ticket balance card on top, one card per topic, fixed tab bar at the bottom, bottom sheets for entry. */
:root{
  --bg:#ECF0F3;--surface:#FFFFFF;--surface-2:#F3F6F9;--ink:#13212E;--muted:#5A6A79;--line:#D3DCE4;
  --accent:#1C4C9A;--accent-ink:#FFFFFF;--accent-soft:#DFE7F4;--perf:rgba(255,255,255,.45);
  --ok:#1B7044;--ok-soft:#D9EEE1;--late:#BC2F25;--late-soft:#F6DDD9;--due:#9A5800;--due-soft:#F8E8CF;
  --shadow:0 1px 2px rgba(19,33,46,.06),0 6px 18px rgba(19,33,46,.06);
  --dim:rgba(8,14,20,.45);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D151D;--surface:#15202B;--surface-2:#1B2834;--ink:#E4EBF1;--muted:#93A3B2;--line:#2A3A49;
  --accent:#8EB1EC;--accent-ink:#0C1828;--accent-soft:#1D2F4C;--perf:rgba(12,24,40,.4);
  --ok:#6BC891;--ok-soft:#163324;--late:#EF8A80;--late-soft:#3B1E1B;--due:#E6AA52;--due-soft:#382A14;
  --shadow:0 0 0 1px #24323F;--dim:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D151D;--surface:#15202B;--surface-2:#1B2834;--ink:#E4EBF1;--muted:#93A3B2;--line:#2A3A49;
  --accent:#8EB1EC;--accent-ink:#0C1828;--accent-soft:#1D2F4C;--perf:rgba(12,24,40,.4);
  --ok:#6BC891;--ok-soft:#163324;--late:#EF8A80;--late-soft:#3B1E1B;--due:#E6AA52;--due-soft:#382A14;
  --shadow:0 0 0 1px #24323F;--dim:rgba(0,0,0,.55);color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.01em;margin:0;line-height:1.1;text-wrap:balance}
.trip{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:right}
#view{display:flex;flex-direction:column;gap:14px}

.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.card h2{font-family:var(--f-display);font-size:19px;font-weight:700;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px;line-height:1.2}
.card h2 small{font-family:var(--f-body);font-size:12.5px;font-weight:500;color:var(--muted);text-align:right}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.muted{color:var(--muted)}
.neg{color:var(--late)}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
.warn{background:var(--due-soft);color:var(--due);border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:500;margin:10px 0 0}
.sub{margin:-2px 0 8px;font-size:13.5px;color:var(--muted)}

/* lift-ticket balance */
.ticket{background:var(--accent);color:var(--accent-ink);border-radius:16px;position:relative}
.ticket-main{padding:16px 18px 14px}
.ticket .eyebrow{opacity:.85}
.big{font-family:var(--f-display);font-weight:700;font-size:46px;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:4px}
.ticket-sub{font-size:13px;opacity:.9;margin-top:4px;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center}
.btn.share{margin-top:12px;width:100%;background:var(--accent-ink);color:var(--accent)}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px;font-weight:600;font-size:13px}
.card .linkbtn{color:var(--accent)}
.warn .linkbtn{color:inherit}
.ticket-stubs{display:grid;grid-template-columns:1fr 1fr;border-top:2px dashed var(--perf);position:relative}
.ticket-stubs::before,.ticket-stubs::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.ticket-stubs::before{left:-9px}
.ticket-stubs::after{right:-9px}
.stub{padding:11px 18px 14px;min-width:0}
.stub+.stub{border-left:2px dashed var(--perf)}
.stub span{font-size:12.5px;opacity:.85}
.stub b{display:block;font-family:var(--f-display);font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .l{min-width:0}
.row .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.row.total .l{font-weight:700}
.row.total .r{font-family:var(--f-display);font-size:21px;font-weight:700}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;font-family:var(--f-body)}
.chip.late{background:var(--late-soft);color:var(--late)}
.chip.due{background:var(--due-soft);color:var(--due)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:9px 14px;font-weight:600;background:var(--accent);color:var(--accent-ink);min-height:42px;text-align:center;text-decoration:none;font-size:15px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--late-soft);color:var(--late)}
.btn.small{min-height:32px;padding:5px 12px;font-size:14px;border-radius:9px}
.btn.block{width:100%}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.actions .btn{flex:1 1 auto}
.toprow{display:flex;gap:8px;flex-wrap:wrap}
.toprow .btn{flex:1 1 140px}

/* payment grid */
.gridwrap{overflow-x:auto;margin:0 -8px;padding:0 8px}
table.grid{border-collapse:separate;border-spacing:3px;width:100%;font-variant-numeric:tabular-nums}
.grid th{font-weight:600;font-size:12px;color:var(--muted);padding:2px 0 3px;text-align:center;white-space:nowrap}
.grid td{padding:0}
.grid .m{text-align:left;font-weight:600;font-size:13px;white-space:nowrap;padding-right:4px;color:var(--ink)}
.grid .m.now{color:var(--accent)}
.cell{display:flex;align-items:center;justify-content:center;width:100%;min-width:42px;height:36px;border:0;border-radius:7px;font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}
.cell.paid{background:var(--ok-soft);color:var(--ok)}
.cell.late{background:var(--late-soft);color:var(--late);box-shadow:inset 0 0 0 1.5px var(--late)}
.cell.due{background:var(--due-soft);color:var(--due);box-shadow:inset 0 0 0 1.5px var(--due)}
.cell.future{background:var(--surface-2);color:var(--muted);font-weight:500}
.cell.off{background:transparent;color:var(--line);cursor:default}
.grid tfoot td{font-size:12px;color:var(--muted);text-align:center;padding-top:5px;font-weight:600}
.grid tfoot td.m{font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.k-paid{background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--ok)}
.k-due{background:var(--due-soft);box-shadow:inset 0 0 0 1.5px var(--due)}
.k-late{background:var(--late-soft);box-shadow:inset 0 0 0 1.5px var(--late)}
.k-future{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.k-spent{background:var(--ok)}
.k-rem{background:var(--accent)}

/* projects */
.projtabs{display:flex;gap:8px;overflow-x:auto;padding:2px;margin:0 -2px;scrollbar-width:none}
.projtabs::-webkit-scrollbar{display:none}
.ptab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 13px;text-align:left;min-height:54px;color:var(--ink)}
.ptab b{display:block;font-size:15px;font-weight:700}
.ptab span{font-size:12px;color:var(--muted);font-weight:500}
.ptab[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--accent-soft)}
.ptab.add{border-style:dashed;color:var(--accent);font-weight:600;display:flex;align-items:center}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2);margin:6px 0 8px;box-shadow:inset 0 0 0 1px var(--line)}
.stack i{display:block;height:100%}
.s-paid{background:var(--ok)}
.s-rem{background:var(--accent)}
.exp{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line)}
.exp:first-child{border-top:0}
.exp-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:12px 0;border-radius:0;color:var(--ink)}
.exp-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.exp-name{font-weight:600;font-size:15.5px;min-width:0}
.exp-amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.exp-meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:3px;font-size:13px}
.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:7px;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;background:var(--ok)}
.goalbig{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin:0 0 12px;display:flex;flex-direction:column;gap:2px}
.goalbig span{font-size:13px;color:var(--muted);font-weight:500}
.goalbig span:first-child{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--accent)}
.goalbig b{font-family:var(--f-display);font-size:38px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.goalbig b small{font-family:var(--f-body);font-size:16px;font-weight:600;color:var(--muted)}
.goalres{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin:2px 0 14px;font-size:14px;color:var(--muted)}
.sched{background:var(--accent-soft);border-radius:12px;padding:6px 14px 12px;margin:2px 0 8px;font-size:14px}
.sched .who{font-weight:700;color:var(--ink);margin-top:8px}
.sched .ln{display:flex;justify-content:space-between;gap:10px;margin-top:6px;color:var(--ink)}
.sched .ln b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sched .det{font-size:12.5px;color:var(--muted)}
.steps{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 0 2px}
.choices{display:flex;flex-direction:column;gap:10px;margin:6px 0 12px}
.choice{display:block;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:14px 16px;color:var(--ink)}
.choice b{display:block;font-family:var(--f-display);font-size:19px;line-height:1.2;margin-bottom:3px}
.choice span{font-size:13.5px;color:var(--muted)}
.choice.rec{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--accent-soft)}
.line{display:grid;grid-template-columns:minmax(0,1fr) 104px 30px;gap:8px;align-items:center;margin-bottom:8px}
.line input{font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);min-height:44px;width:100%;min-width:0}
.goalres b{display:block;font-family:var(--f-display);font-size:30px;color:var(--ink);line-height:1.15}
h3.mini{font-family:var(--f-display);font-size:16px;margin:14px 0 2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 14px}
.kpis div{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.kpis span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kpis b{display:block;font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
.field label,.flabel{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select{font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);min-height:44px;width:100%;min-width:0}
.field input:disabled{opacity:.7}
.field textarea{font:inherit;font-size:16px;line-height:1.45;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);width:100%;min-width:0;resize:vertical}
.btns{display:flex;gap:6px}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;min-height:38px;color:var(--ink)}
.pick button.late{border-color:var(--late);color:var(--late)}
.pick button.due{border-color:var(--due);color:var(--due)}
.pick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sug{margin:-4px 0 14px}
.sug button{font-size:13px;min-height:32px;padding:4px 11px;font-weight:500}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);border-radius:11px;padding:4px;margin-bottom:12px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 6px;font-weight:600;font-size:14px;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.person{border-top:1px solid var(--line);padding:12px 0 2px}
.person:first-of-type{border-top:0}
.checks{display:flex;gap:6px 18px;flex-wrap:wrap;margin:-2px 0 12px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.pos{color:var(--ok)}
.plancard{box-shadow:inset 0 0 0 2px var(--accent)}
.planlist{margin:4px 0 6px;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:14px;line-height:1.4}
.effects{margin-top:8px;font-size:13.5px;color:var(--ink)}
.effects>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.effects ul{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.goalres .effects b{display:inline;font-family:inherit;font-size:inherit;font-weight:700;color:var(--ink);margin:0;line-height:inherit}
.goalres .effects li{line-height:1.4}
.linenote{margin:-4px 0 8px;font-size:12px;color:var(--muted)}
.restflow{margin-top:8px}
.restflow>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.restflow .sched{background:var(--surface);margin:4px 0 0}
.dellist{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px;min-height:34px;color:var(--ink)}
.pchip small{font-size:11px;font-weight:600;color:var(--accent)}
.pchip.guest{border-color:var(--accent);background:var(--accent-soft)}
.pchip .x{width:22px;height:22px;font-size:15px;margin:0 -6px 0 -2px;background:transparent}
.pchip.add{border-style:dashed;color:var(--accent);background:transparent}
.row .r small.st{font-size:12.5px;font-weight:600}
.calckeys{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.calckeys button{flex:1 1 0;min-width:30px;max-width:52px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font-size:19px;font-weight:600;line-height:1;padding:0;touch-action:manipulation}
.calckeys button:active{background:var(--accent-soft)}
.calcres{flex:1 1 100%;font-size:13px;font-weight:600;color:var(--accent)}
.calcres:empty{display:none}
.calcres.bad{color:var(--muted);font-weight:500}
#wz-lines+.calckeys{margin:-2px 0 10px}
.x{border:0;background:var(--surface-2);color:var(--muted);width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:600}
.tabs a[aria-current="page"]{color:var(--accent)}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* sheet */
.backdrop{position:fixed;inset:0;background:var(--dim);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:560px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;max-height:88%;overflow:auto;overscroll-behavior:contain;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .22s ease}
.sheet.open{transform:none}
.sheet-head{position:sticky;top:0;background:var(--surface);padding:8px 0 4px;z-index:1;display:flex;justify-content:center}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin-top:2px}
.close{position:absolute;right:0;top:6px;border:0;background:var(--surface-2);width:32px;height:32px;border-radius:50%;font-size:20px;line-height:1;color:var(--muted)}
.sheet h3{font-family:var(--f-display);font-size:23px;margin:0 40px 4px 0;line-height:1.15}
.sheet h4{font-family:var(--f-display);font-size:17px;margin:16px 0 2px}
.sheet .lead{font-size:13.5px;color:var(--muted);margin:0 0 14px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
@media (max-width:360px){.big{font-size:40px}.stub b{font-size:22px}.kpis b{font-size:17px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">

<script>
'use strict';
const $=s=>document.querySelector(s);
const view=$('#view'),sheetEl=$('#sheet'),sheetBody=$('#sheet-body'),backdrop=$('#backdrop'),toastEl=$('#toast'),tripEl=$('#trip');
const ROUTES=['accueil','versements','voyages','reglages'];
const S={people:{},payments:{},expenses:{},projects:{},extras:{},moves:{},allocs:{},settings:null,ready:{p:false,pay:false,e:false,pr:false,x:false,m:false,a:false,s:false},db:null,canWrite:true,status:'loading',sel:null,showAll:false,delArm:null};
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MOIS_C=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const SUGGEST=['Villa','Location véhicule','Gazole','Péages','Courses et restos','Activités','Billets d’avion','Hôtel'];
const pad=n=>String(n).padStart(2,'0');
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const r2=n=>Math.round((+n||0)*100)/100;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf2=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
const nf0=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const eur=n=>{n=r2(n);return Number.isInteger(n)?nf0.format(n):nf2.format(n)};
const fmtN=n=>{n=r2(n);return Number.isInteger(n)?String(n):n.toFixed(2).replace('.',',')};
/* Petits calculs dans les montants : 170 x 2, 170 × 2 + 120 × 2, 600 / 6. Pas d'eval. */
function calcExpr(v){
  if(v==null)return null;
  const s=String(v).replace(/[\s€\u00a0\u202f]/g,'').replace(/,/g,'.').replace(/[x×X*]/g,'*').replace(/[÷\/:]/g,'/').replace(/[−–]/g,'-');
  if(!/^[-+]?\d+(\.\d+)?([-+*\/]\d+(\.\d+)?)*$/.test(s))return null;
  const t=s.match(/\d+(?:\.\d+)?|[-+*\/]/g);let i=0,sign=1,total=0;
  if(t[0]==='-'||t[0]==='+'){sign=t[0]==='-'?-1:1;i=1}
  let term=+t[i++];
  while(i<t.length){const op=t[i++],n=+t[i++];if(op==='*')term*=n;else if(op==='/'){if(!n)return null;term/=n}else{total+=sign*term;sign=op==='-'?-1:1;term=n}}
  total+=sign*term;return Number.isFinite(total)?total:null;
}
const hasOp=v=>/\d\s*[x×X*÷\/+\-−–]\s*\d/.test(String(v==null?'':v));
const prettyExpr=v=>String(v).replace(/\s+/g,'').replace(/[x×X*]/g,' × ').replace(/[÷\/]/g,' ÷ ').replace(/\+/g,' + ').replace(/(\d)[-−–](?=\d)/g,'$1 − ');
const isCalcNote=n=>!!n&&hasOp(n)&&calcExpr(n)!=null;
const num=v=>{if(v===''||v==null)return null;const e=calcExpr(v);if(e!=null)return e;if(hasOp(v)||/[x×*÷\/+]\s*$/i.test(String(v)))return null;const x=parseFloat(String(v).replace(/[\s€\u00a0\u202f]/g,'').replace(',','.'));return Number.isFinite(x)?x:null};
const W=()=>!!S.db&&S.canWrite;
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function localDate(iso){const d=new Date(iso);return isNaN(d)?todayStr():`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function addMonth(m,k=1){let [y,mm]=m.split('-').map(Number);mm+=k;while(mm>12){mm-=12;y++}while(mm<1){mm+=12;y--}return `${y}-${pad(mm)}`}
function monthsBetween(a,b){const r=[];if(!a||!b)return r;let m=a;for(let i=0;i<240&&m<=b;i++){r.push(m);m=addMonth(m)}return r}
function mLabel(m,short){if(!m)return '';const [y,mm]=m.split('-');const n=(short?MOIS_C:MOIS)[+mm-1]||'';const base=(S.settings&&S.settings.startMonth||'').slice(0,4);return cap(n)+(base&&y!==base?' '+y.slice(2):'')}
function mYear(m){if(!m)return '';const [y,mm]=m.split('-');return cap(MOIS[+mm-1]||'')+' '+y}
function fmtDate(s){if(!s)return '';const [y,m,d]=s.split('-').map(Number);return `${d} ${MOIS_C[m-1]}${String(y)!==todayStr().slice(0,4)?' '+y:''}`}
function fmtDateTime(iso){if(!iso)return '';const d=new Date(iso);if(isNaN(d))return '';return `le ${d.getDate()} ${MOIS_C[d.getMonth()]} à ${pad(d.getHours())}:${pad(d.getMinutes())}`}
const payKey=(pid,m)=>pid+'_'+m;
const sumPay=e=>(e.payments||[]).reduce((s,x)=>s+(+x.amount||0),0);
/* Un paiement « by » a été avancé par une personne : il ne sort pas du livret. */
const potPay=e=>(e.payments||[]).reduce((s,x)=>s+(x.by?0:(+x.amount||0)),0);
const expCost=e=>{const pd=sumPay(e);return e.rest||e.closed||e.planned==null?pd:Math.max(+e.planned,pd)};
const projGuests=pr=>(pr&&Array.isArray(pr.guests)?pr.guests:[]).filter(g=>g&&g.id);
function partName(pr,id){if(!id||id==='pot')return 'la cagnotte';if(S.people[id])return S.people[id].name;const g=projGuests(pr).find(g=>g.id===id);return g?g.name:'quelqu’un'}
/* Dernier versement : le mois du voyage (par défaut) ou le mois d'avant. */
const lastPayMonth=(trip,rule)=>rule==='before'?addMonth(trip,-1):trip;
const isMonth=v=>/^\d{4}-\d{2}$/.test(v||'');
function payCount(first,trip,rule){if(!isMonth(first)||!isMonth(trip))return 0;const l=lastPayMonth(trip,rule);return l>=first?monthsBetween(first,l).length:0}
function endRuleOf(pr){if(pr.endRule)return pr.endRule;if(pr.firstMonth&&+pr.installments>0&&isMonth(pr.month)&&+pr.installments===payCount(pr.firstMonth,pr.month,'before'))return 'before';return 'trip'}
/* Prévient quand les cotisations d'un voyage commencent tard : moins de mois = mensualités plus grosses. */
function lateStartNote(first,trip,rule){
  const nf=nextFreeMonth();if(!isMonth(first)||first<=nf)return '';
  const n2=payCount(nf,trip,rule);if(!n2)return '';
  return `<br><span class="neg">Rien ne va à ce voyage avant ${mShort(first)}.</span> En commençant dès ${mShort(nf)}, ce serait ${n2} mensualités au lieu de ${payCount(first,trip,rule)}.`;
}
function monthsMsg(first,trip,rule){
  if(!isMonth(trip))return 'Indique le mois du voyage.';
  if(!isMonth(first))return 'Choisis le mois du premier versement.';
  const n=payCount(first,trip,rule);
  if(!n)return rule==='before'?'Le premier versement doit être avant le mois du voyage.':'Le premier versement doit être au plus tard le mois du voyage.';
  if(n>120)return 'C’est plus de 10 ans de versements : vérifie les dates.';
  return '';
}
const capFirst=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const byOrder=(a,b)=>(a.order??99)-(b.order??99);
function sortedPeople(){return Object.values(S.people).sort((a,b)=>byOrder(a,b)||String(a.name).localeCompare(String(b.name),'fr'))}
function sortedExpenses(){return Object.values(S.expenses).sort((a,b)=>byOrder(a,b)||String(a.label).localeCompare(String(b.label),'fr'))}
function sortedProjects(){return Object.values(S.projects).sort((a,b)=>String(a.month||'9999-99').localeCompare(String(b.month||'9999-99'))||byOrder(a,b))}
function expProject(e){if(e.project&&S.projects[e.project])return e.project;const f=sortedProjects()[0];return f?f.id:null}
function projEnd(pr){return pr.endDate||(pr.month?pr.month+'-31':null)}
function projDate(pr){if(pr.startDate&&pr.endDate)return `du ${fmtDate(pr.startDate)} au ${fmtDate(pr.endDate)}`;if(pr.endDate&&pr.month)return mYear(pr.month)+' · fin le '+fmtDate(pr.endDate);if(pr.month)return mYear(pr.month);if(pr.endDate)return 'fin le '+fmtDate(pr.endDate);return 'Date à fixer'}
function slug(s){return (String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'p')+'-'+Date.now().toString(36).slice(-4)}
const row=(l,r,cls)=>`<div class="row ${cls||''}"><div class="l">${l}</div><div class="r">${r}</div></div>`;
/* Après la dernière échéance du crédit, la part crédit de chacun part aux voyages. */
/* Une cotisation peut changer à partir d'un mois (p.rates). */
function sortRates(p){return [...(p.rates||[])].sort((a,b)=>String(a.from).localeCompare(String(b.from)))}
function rateFor(p,m){let r={monthly:+p.monthly||0,ski:+p.ski||0,credit:+p.credit||0};for(const x of sortRates(p))if(m>=x.from)r={monthly:+x.monthly||0,ski:+x.ski||0,credit:+x.credit||0};return r}
function shareFor(p,m){const ce=S.settings.creditEndMonth;const after=!!(ce&&m>ce);const r=rateFor(p,m);return {ski:r.ski+(after?r.credit:0),credit:after?0:r.credit}}
function splitFor(p,m,amount){const sh=shareFor(p,m),tot=sh.ski+sh.credit;if(!tot)return {ski:r2(amount),credit:0};return {ski:r2(amount*sh.ski/tot),credit:r2(amount*sh.credit/tot)}}
function inPeriod(p,m,start){return m>=(p.fromMonth||start)&&(!p.untilMonth||m<=p.untilMonth)}

function creditDates(fromExcl,toIncl){
  const st=S.settings,out=[];
  if(!fromExcl||!toIncl||toIncl<=fromExcl)return out;
  const day=Math.min(Math.max(parseInt(st.creditDay,10)||1,1),28);
  let m=fromExcl.slice(0,7);
  for(let i=0;i<240;i++){const d=`${m}-${pad(day)}`;if(d>toIncl)break;if(d>fromExcl&&(!st.creditEndMonth||m<=st.creditEndMonth))out.push(d);m=addMonth(m)}
  return out;
}

/* ---------- money model ----------
   Livret = versements + virements exceptionnels − dépenses des voyages − prélèvements du crédit.
   Pot voyages = parts voyages + virements exceptionnels « voyages » − toutes les dépenses des voyages.
   Les voyages se suivent par date : ce qui reste d'un voyage passe au suivant. */
function calc(){
  const st=S.settings,today=todayStr(),cm=today.slice(0,7);
  const start=st.startMonth||cm;
  const gridEnd=[st.endMonth||cm,addMonth(cm,2)].sort().pop();
  const months=monthsBetween(start,gridEnd);
  const active=sortedPeople().filter(p=>p.active!==false);
  const anchorAt=st.anchorAt||'';
  const anchorDay=anchorAt?localDate(anchorAt):'';
  const isNew=x=>{if(!anchorAt)return true;const d=x.date||'';return d>anchorDay||(d===anchorDay&&(x.recordedAt||'')>anchorAt)};
  const cmo=+st.creditMonthly||0;
  let vIn=0,vOut=0,newIn=0,newOut=0;
  for(const p of Object.values(S.payments)){vIn+=+p.ski||0;if(isNew(p))newIn+=+p.amount||0}
  for(const x of Object.values(S.extras)){if(x.target!=='credit')vIn+=+x.amount||0;if(isNew(x))newIn+=+x.amount||0}
  for(const e of Object.values(S.expenses))for(const x of e.payments||[]){if(x.by)continue;vOut+=+x.amount||0;if(isNew(x))newOut+=+x.amount||0}
  /* Remboursements d'un voyage : vers la cagnotte (un invité paie sa part) ou depuis la cagnotte (rembourser une avance). */
  for(const pr of Object.values(S.projects))for(const s of pr.settles||[]){
    const a=+s.amount||0;
    if(s.to==='pot'&&s.from!=='pot'){vIn+=a;if(isNew(s))newIn+=a}
    else if(s.from==='pot'&&s.to!=='pot'){vOut+=a;if(isNew(s))newOut+=a}
  }
  for(const x of Object.values(S.moves)){
    const a=+x.amount||0;
    if(x.dir==='transfer'){vIn+=a;continue}
    const sgn=x.dir==='in'?1:-1;
    if(isNew(x)){if(sgn>0)newIn+=a;else newOut+=a}
    if(x.target==='voyages')vIn+=sgn*a;
  }
  const creditPast=anchorDay?creditDates(anchorDay,today).length:0;
  const est=r2((+st.anchorBalance||0)+newIn-newOut-cmo*creditPast);
  const pot=r2(vIn-vOut),reserve=r2(est-pot);
  const unpaid=(p,m)=>inPeriod(p,m,start)&&!S.payments[payKey(p.id,m)];
  const owe={};
  for(const p of active)for(const m of months){
    if(m>cm||!unpaid(p,m)||rateFor(p,m).monthly<=0)continue;
    const o=owe[p.id]||(owe[p.id]={p,late:[],due:[],total:0});
    (m<cm?o.late:o.due).push(m);o.total+=rateFor(p,m).monthly;
  }
  const cEnd=st.creditEndMonth||null;
  const remainingCredit=cmo&&cEnd?creditDates(today,cEnd+'-31').length:0;
  const creditDone=!!(cmo&&cEnd&&remainingCredit===0);
  let surplus=null;
  if(cmo&&cEnd&&!creditDone){let ec=0;for(const m of monthsBetween(start,cEnd))for(const p of active)if(unpaid(p,m))ec+=shareFor(p,m).credit;surplus=r2(reserve+ec-cmo*remainingCredit)}
  /* Chaque projet a ses propres mois de versement et ses participants. Rien ne passe d'un projet à l'autre
     sans transfert noté à la main. Un versement va aux projets dont les mois le couvrent ; sinon il reste « non affecté ». */
  const prs=sortedProjects(),WIN={};let prevM=null;
  const plannedOf=id=>r2(sortedExpenses().filter(e=>expProject(e)===id).reduce((s,e)=>{const pd=sumPay(e);return s+(e.rest||e.closed||e.planned==null?pd:Math.max(+e.planned,pd))},0));
  for(const pr of prs){
    /* Ancienne règle (projet sans dates de cotisation) : il commence après le voyage précédent.
       Un projet qui a ses propres mois ne compte comme « précédent » que s'il a commencé avant :
       un voyage préparé en parallèle (ex. Ski 2027 pendant Voyage 2028) ne raccourcit plus les autres. */
    const legacyStart=[start,prevM?addMonth(prevM):start].sort().pop();
    let ms=[],own=true;
    if(pr.firstMonth&&pr.endRule&&pr.month)ms=monthsBetween(pr.firstMonth,lastPayMonth(pr.month,pr.endRule));
    else if(pr.firstMonth&&+pr.installments>0)ms=monthsBetween(pr.firstMonth,addMonth(pr.firstMonth,+pr.installments-1));
    else if(pr.month){ms=monthsBetween(legacyStart,pr.month);own=false}
    if(pr.month&&(!own||(ms.length&&ms[0]<legacyStart)))prevM=pr.month;
    const mem=Array.isArray(pr.members)&&pr.members.length?pr.members.filter(id=>S.people[id]):active.filter(p=>ms.some(m=>inPeriod(p,m,start)&&shareFor(p,m).ski>0)).map(p=>p.id);
    /* Financement : « monthly » = mensualité connue, « expenses » = prix estimé avec les dépenses prévues,
       « goal » = prix total connu. */
    let mode=null,goal=null,perMonth=null;
    if(pr.mode==='monthly'){if(+pr.perMonth>0){mode='monthly';perMonth=+pr.perMonth}}
    else if(pr.mode==='expenses'){mode='expenses';const g=plannedOf(pr.id);goal=g>0?g:null}
    else if(pr.mode==='rest')mode='rest';
    else if(+pr.goal>0){mode='goal';goal=+pr.goal}
    /* creditIn : la mensualité saisie comprend la part crédit (ex. 150 € = 100 € voyage + 50 € crédit). */
    WIN[pr.id]={ms,set:new Set(ms),mem,memSet:new Set(mem),mode,goal,perMonth,total:mode==='rest'?(+pr.total||null):null,creditIn:mode==='monthly'&&pr.creditIncluded!==false,
      theo:mode==='monthly'?perMonth:goal&&ms.length&&mem.length?goal/(ms.length*mem.length):null};
  }
  /* Ce qui va au voyage pour une personne et un mois. Tant que le crédit court, sa part est retirée de la mensualité
     « crédit compris » (une seule fois, même si plusieurs projets se recoupent : d'abord au projet commencé le premier). */
  const crOrder=prs.filter(pr=>WIN[pr.id].creditIn).sort((a,b)=>String(WIN[a.id].ms[0]||'').localeCompare(String(WIN[b.id].ms[0]||''))||byOrder(a,b));
  const tgt=(pr,p,m)=>{
    const w=WIN[pr.id];if(!w.theo)return 0;
    if(!w.creditIn)return w.theo;
    let cr=shareFor(p,m).credit;
    for(const q of crOrder){
      const v=WIN[q.id];if(!v.creditIn||!v.set.has(m)||!v.memSet.has(p.id))continue;
      const d=Math.min(cr,v.perMonth);if(q.id===pr.id)return v.perMonth-d;cr-=d;
    }
    return w.perMonth;
  };
  /* part crédit qui n'est comprise dans aucune mensualité : elle s'ajoute en plus */
  const crFree=(p,m)=>{let cr=shareFor(p,m).credit;for(const q of crOrder){const v=WIN[q.id];if(v.set.has(m)&&v.memSet.has(p.id))cr-=Math.min(cr,v.perMonth)}return cr};
  /* Partage d'un versement entre les projets du mois : ceux qui ont un financement reçoivent d'abord leur mensualité
     (au prorata si le versement ne suffit pas), le reste va à parts égales aux projets sans financement. */
  const split=(p,m,a)=>{
    const cand=prs.filter(pr=>WIN[pr.id].set.has(m)&&WIN[pr.id].memSet.has(p.id));if(!cand.length)return [];
    const fixed=cand.filter(pr=>WIN[pr.id].theo),free=cand.filter(pr=>!WIN[pr.id].theo);
    const T=fixed.map(pr=>tgt(pr,p,m)),need=T.reduce((s,v)=>s+v,0);
    if(!free.length)return fixed.map((pr,i)=>[pr.id,need>0?a*T[i]/need:a/fixed.length]);
    const toFixed=Math.min(a,need),rest=a-toFixed;
    return fixed.map((pr,i)=>[pr.id,need>0?toFixed*T[i]/need:0]).concat(free.map(pr=>[pr.id,rest/free.length]));
  };
  const col={};prs.forEach(pr=>{col[pr.id]=0});let unalloc=0;
  const give=(id,a)=>{if(id&&col[id]!=null)col[id]+=a;else unalloc+=a};
  for(const pay of Object.values(S.payments)){
    const a=+pay.ski||0;if(!a)continue;
    const p=S.people[pay.person],t=p?split(p,pay.month,a):[];
    if(!t.length)unalloc+=a;else t.forEach(([id,v])=>{col[id]+=v});
  }
  for(const x of Object.values(S.extras))if(x.target!=='credit')give(x.project,+x.amount||0);
  for(const x of Object.values(S.moves)){const a=+x.amount||0;if(x.dir==='transfer')give(x.project,a);else if(x.target==='voyages')give(x.project,(x.dir==='in'?1:-1)*a)}
  for(const x of Object.values(S.allocs)){const a=+x.amount||0;give(x.from,-a);give(x.to,a)}
  const proj={},order=[],live=[];
  for(const pr of prs){
    const exps=sortedExpenses().filter(e=>expProject(e)===pr.id);
    let paid=0,paidAll=0,planned=0,remaining=0;const unest=[],rest=[];
    for(const e of exps){
      const pd=sumPay(e);paid+=potPay(e);paidAll+=pd;
      if(e.rest){rest.push(e);planned+=pd}
      else if(e.closed){planned+=pd}
      else if(e.planned==null){unest.push(e);planned+=pd}
      else{planned+=Math.max(+e.planned,pd);remaining+=Math.max(+e.planned-pd,0)}
    }
    const end=projEnd(pr),w=WIN[pr.id];
    let expected=0,U=0,bud=0;
    const cuts={};let crLast=null;
    for(const m of w.ms)for(const p of active){
      if(w.memSet.has(p.id)&&inPeriod(p,m,start)){
        /* part crédit de la mensualité : retirée du voyage (mode crédit compris) ou ajoutée en plus (autres modes) */
        const d=r2(w.creditIn?w.perMonth-tgt(pr,p,m):crFree(p,m));
        if(d>0.005){cuts[d]=(cuts[d]||0)+1;if(!crLast||m>crLast)crLast=m}
      }
      if(!unpaid(p,m))continue;
      if(w.memSet.has(p.id)){U++;bud+=tgt(pr,p,m)}
      const t=split(p,m,shareFor(p,m).ski).find(z=>z[0]===pr.id);if(t)expected+=t[1];
    }
    const crCut=Object.keys(cuts).length?+Object.keys(cuts).sort((a,b)=>cuts[b]-cuts[a])[0]:0;
    /* Comptes du voyage (façon Tricount). Participants = cotisants du projet + invités.
       Chaque dépense est partagée entre les participants concernés (tout le monde par défaut).
       Les cotisants paient leur part avec la cagnotte ; un invité doit sa part ; une avance est due à celui qui l'a faite. */
    const guests=projGuests(pr),guestSet=new Set(guests.map(g=>g.id));
    const parts=w.mem.concat(guests.map(g=>g.id)),partSet=new Set(parts);
    const share={},credit={};parts.forEach(id=>{share[id]=0;credit[id]=0});
    for(const e of exps){
      const cost=expCost(e);
      let C=Array.isArray(e.split)&&e.split.length?e.split.filter(id=>partSet.has(id)):[];if(!C.length)C=parts;
      C.forEach(id=>{share[id]+=cost/C.length});
      for(const q of e.payments||[])if(q.by)credit[q.by]=(credit[q.by]||0)+(+q.amount||0);
    }
    let setIn=0,setOut=0,guestIn=0;
    for(const s of pr.settles||[]){
      const a=+s.amount||0;if(s.from===s.to)continue;
      if(s.from!=='pot')credit[s.from]=(credit[s.from]||0)+a;
      if(s.to!=='pot')credit[s.to]=(credit[s.to]||0)-a;
      if(s.to==='pot'){setIn+=a;if(guestSet.has(s.from))guestIn+=a}
      if(s.from==='pot')setOut+=a;
    }
    const bal={};let toReceive=0,toRepay=0,guestShare=0;
    for(const id of new Set(Object.keys(credit).concat(guests.map(g=>g.id)))){
      const b=r2((credit[id]||0)-(guestSet.has(id)?share[id]:0));
      if(guestSet.has(id))guestShare+=share[id];
      if(Math.abs(b)>0.005||guestSet.has(id))bal[id]=b;
      if(b<-0.005)toReceive+=-b;else if(b>0.005)toRepay+=b;
    }
    const ledger={parts,guests,share,credit,bal,guestShare:r2(guestShare),guestIn:r2(guestIn),toReceive:r2(toReceive),toRepay:r2(toRepay),
      settles:[...(pr.settles||[])].sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.recordedAt).localeCompare(String(a.recordedAt))),
      cost:r2(exps.reduce((s,e)=>s+expCost(e),0)),
      active:guests.length>0||Object.keys(bal).length>0||(pr.settles||[]).length>0};
    const collected=r2(col[pr.id]+setIn);paid+=setOut;
    const x={pr,exps,paid:r2(paid),paidAll:r2(paidAll),planned:r2(planned),remaining:r2(remaining),unest,rest,end,passed:!!(end&&today>end),
      win:w.ms,members:w.mem,mode:w.mode,goal:w.goal,perMonth:w.perMonth,theo:w.theo,creditIn:w.creditIn,crCut,crLast,collected,balance:r2(collected-paid),expected:r2(expected),U,next:null,ledger};
    /* ce que les invités doivent encore verser s'ajoute, les avances à rembourser se retirent */
    x.available=r2(x.balance+x.expected-x.remaining+ledger.toReceive-ledger.toRepay);
    const cotCollected=r2(collected-ledger.guestIn);
    x.projected=r2(cotCollected+x.expected+ledger.guestShare);
    if(w.goal){x.toCollect=r2(Math.max(w.goal-cotCollected-ledger.guestShare,0));x.needed=U>0?x.toCollect/U:null}
    if(w.perMonth)x.budget=r2(cotCollected+bud+ledger.guestShare);
    /* « Le reste » : la cotisation ne change pas ; ce voyage reçoit ce qui reste après le crédit et les autres voyages. */
    if(w.mode==='rest'){
      x.budget=x.projected;x.total=w.total;x.flow={};x.restZero=[];x.rateOff=[];
      for(const pid of w.mem){
        const p=S.people[pid];if(!p)continue;const arr=[];
        for(const m of w.ms){
          if(!inPeriod(p,m,start))continue;
          const pay=S.payments[payKey(pid,m)],a=pay?(+pay.ski||0):shareFor(p,m).ski;
          const t=split(p,m,a).find(z=>z[0]===pr.id),v=r2(t?t[1]:0);arr.push([m,v]);
          if(!pay&&v<0.5&&!x.restZero.includes(pid))x.restZero.push(pid);
          if(!pay&&w.total&&Math.abs(rateFor(p,m).monthly-w.total)>0.005&&!x.rateOff.includes(pid))x.rateOff.push(pid);
        }
        x.flow[pid]=arr;
      }
    }
    x.target=w.mode==='monthly'?w.perMonth:(x.needed!=null&&x.toCollect>0.005?ceilE(x.needed):null);
    proj[pr.id]=x;order.push(pr.id);if(!x.passed)live.push(x);
  }
  const current=live.length?live[0].pr.id:null;
  if(live[0]){live[0].isFirst=true;live[0].next=live[1]||null}
  let horizon=(current&&proj[current].pr.month)||addMonth(cm,1);
  if(cEnd&&!creditDone&&horizon>cEnd)horizon=cEnd;
  let expCr=0;for(const m of monthsBetween(start,horizon))for(const p of active)if(unpaid(p,m))expCr+=shareFor(p,m).credit;
  const reserveEnd=r2(reserve+expCr-cmo*creditDates(today,horizon+'-31').length);
  const nextCredit=cmo&&!creditDone?(creditDates(today,addMonth(cm,36)+'-31')[0]||null):null;
  const monthlyCrIn=active.reduce((s,p)=>s+(inPeriod(p,cm,start)?shareFor(p,cm).credit:0),0);
  return {today,cm,start,months,est,pot,reserve,owe,proj,order,crOrder:crOrder.map(pr=>pr.id),current,horizon,reserveEnd,nextCredit,monthlyCrIn,vIn,vOut,cEnd,remainingCredit,creditDone,surplus,unalloc:r2(unalloc),capital:r2(cmo*remainingCredit)};
}

function stateCard(t,txt,btn){return `<section class="card"><h2>${t}</h2><p class="note">${txt}</p>${btn||''}</section>`}
function statusChip(x){if(x.passed)return '<span class="chip">Terminé</span>';const cm=todayStr().slice(0,7);return (x.isFirst||(x.win.length&&x.win[0]<=cm))?'<span class="chip ok">En cours</span>':'<span class="chip">À venir</span>'}
const mShort=m=>MOIS_C[+m.slice(5)-1]+' '+m.slice(0,4);
const winText=x=>x.win.length?`${x.win.length} mensualité${x.win.length>1?'s':''}, de ${mShort(x.win[0])} à ${mShort(x.win[x.win.length-1])}`:'aucun mois de versement';
const ceilE=n=>Math.ceil(r2(n)-1e-9);
function projName(id){return id&&S.projects[id]?S.projects[id].name:'Non affecté'}
const restNames=x=>x.rest.map(e=>esc(e.label).toLowerCase()).join(', ');

function dayBudget(x){
  const pr=x.pr;if(!x.rest.length)return '';
  if(!pr.startDate||!pr.endDate)return !x.passed?`<p class="note">Ajoute les dates du séjour au projet pour voir le budget par jour pour ${restNames(x)}.</p>`:'';
  const t=todayStr(),from=t>pr.startDate?t:pr.startDate;
  if(from>pr.endDate||x.available<=0)return '';
  const days=Math.round((new Date(pr.endDate+'T12:00:00')-new Date(from+'T12:00:00'))/864e5)+1;
  const during=t>=pr.startDate;
  return `<p class="warn" style="background:var(--ok-soft);color:var(--ok)"><b>${eur(x.available/days)} par jour</b> pour ${restNames(x)}, sur ${days} jour${days>1?'s':''}${during?' restant'+(days>1?'s':''):' de séjour'}.</p>`;
}
function creditCard(c,hz){
  const st=S.settings;
  if(c.creditDone)return `<section class="card">
  <h2>Crédit <span class="chip ok">Remboursé</span></h2>
  <div class="rows">${row('Réserve restante',`<span class="${c.reserve<0?'neg':''}">${eur(c.reserve)}</span>`)}</div>
  ${c.reserve>0&&W()?`<div class="actions" style="margin-top:8px"><button class="btn block" data-act="credit-transfer">Basculer ${eur(c.reserve)} vers les voyages</button></div>`:''}
  <p class="note">Les parts crédit de chacun vont maintenant aux voyages.</p>
</section>`;
  const rows=[row('Prochain prélèvement',c.nextCredit?eur(st.creditMonthly)+' · '+fmtDate(c.nextCredit):'Aucun')];
  if(c.cEnd){
    rows.push(row(`Dernière mensualité<div class="note">${c.remainingCredit} prélèvement${c.remainingCredit>1?'s':''} restant${c.remainingCredit>1?'s':''}</div>`,mYear(c.cEnd)));
    rows.push(row('Reste à rembourser',eur(c.capital)));
  }
  rows.push(row('Part crédit versée chaque mois',eur(c.monthlyCrIn)));

  else rows.push(`<div class="row total"><div class="l">Réserve crédit fin ${hz}<div class="note">si tout le monde paie</div></div><div class="r ${c.reserveEnd<0?'neg':''}">${eur(c.reserveEnd)}</div></div>`);
  let more='';
  if(c.surplus>0)more+=`<p class="note">Une fois le crédit fini, ce surplus pourra être transféré vers le projet de ton choix. Après ${mYear(c.cEnd).toLowerCase()}, les parts crédit basculent vers les voyages.</p>`;
  if(c.surplus!=null&&c.surplus<0)more+=`<p class="warn">La réserve ne suffira pas : il manquera ${eur(-c.surplus)}.${W()?' <button class="linkbtn" data-act="extra-new">Faire un virement exceptionnel</button>':''}</p>`;
  if(!c.cEnd)more+=`<p class="note">Indique la dernière échéance dans Réglages pour voir la fin du crédit.</p>`;
  return `<section class="card"><h2>Crédit</h2><div class="rows">${rows.join('')}</div>${more}<p class="note">La réserve crédit, c’est le livret moins le pot voyages.</p></section>`;
}
function budgetBlock(c,x,full){
  const pr=x.pr,id=esc(pr.id),rows=[];
  const L=x.ledger;
  rows.push(row(`Collecté pour ce projet<div class="note">${winText(x)}${L.guestIn>0.005?` · dont ${eur(L.guestIn)} des invités`:''}</div>`,eur(x.collected)));
  const reimb=L.settles.some(s=>s.from==='pot'&&s.to!=='pot'),adv=x.exps.some(e=>(e.payments||[]).some(q=>q.by));
  if(x.paid>0)rows.push(row(`Dépenses déjà payées${reimb?'<div class="note">par la cagnotte, remboursements compris</div>':adv?'<div class="note">par la cagnotte</div>':''}`,'− '+eur(x.paid)));
  if(x.expected>0)rows.push(row(`Versements encore attendus${x.passed?'<div class="note">retards</div>':''}`,'+ '+eur(x.expected)));
  if(L.toReceive>0.005)rows.push(row(`Encore dû à la cagnotte<div class="note">part des invités${L.guests.length?'':' et autres'}</div>`,'+ '+eur(L.toReceive)));
  if(L.toRepay>0.005)rows.push(row(`Avances à rembourser<div class="note">payées de leur poche</div>`,'− '+eur(L.toRepay)));
  if(x.remaining>0)rows.push(row('Reste à payer sur les dépenses','− '+eur(x.remaining)));
  const lbl=x.passed?'Reste sur ce projet':x.rest.length?'Reste pour '+restNames(x):x.exps.length?'Marge':'Budget prévu';
  const cond=x.expected>0||L.toReceive>0.005?'<div class="note">si tout le monde paie</div>':'';
  rows.push(`<div class="row total"><div class="l">${lbl}${cond}</div><div class="r ${x.available<0?'neg':''}">${eur(x.available)}</div></div>`);
  let more=x.passed?'':dayBudget(x);
  if(!x.win.length&&!x.passed)more+=`<p class="note">Ce projet ne reçoit encore aucun versement. Fixe un objectif pour choisir ses mois de versement.</p>`;
  if(x.available<0&&!x.passed)more+=`<p class="warn">Il manque ${eur(-x.available)} pour ce voyage.${W()?` <button class="linkbtn" data-act="extra-new">Virement exceptionnel</button> · <button class="linkbtn" data-act="alloc-new" data-to="${id}">Transférer depuis un autre projet</button>`:''}</p>`;
  if(x.unest.length)more+=`<p class="warn">Sans montant prévu : ${x.unest.map(e=>esc(e.label).toLowerCase()).join(', ')}.</p>`;
  if(x.passed&&x.balance>0.005&&W())more+=`<p class="note">Le reste d’un voyage ne passe plus tout seul au suivant.</p><div class="actions"><button class="btn ghost block" data-act="alloc-new" data-from="${id}">Transférer ce reste</button></div>`;
  if(full){
    const tr=Object.values(S.allocs).filter(a=>a.from===pr.id||a.to===pr.id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    if(tr.length)more+=`<h3 class="mini">Transferts</h3><div class="rows">${tr.map(a=>{const out=a.from===pr.id;return row(`${out?'Vers':'Depuis'} ${esc(projName(out?a.to:a.from))}<div class="note">${fmtDate(a.date)}${a.note?' · '+esc(a.note):''}</div>`,`<span class="${out?'neg':''}">${out?'− ':'+ '}${eur(a.amount)}</span>${W()?`<button class="btn small ${S.delArm===a.id?'danger':'ghost'}" data-act="alloc-del" data-id="${esc(a.id)}">${S.delArm===a.id?'Confirmer':'Retirer'}</button>`:''}`)}).join('')}</div>`;
  }
  return `<div class="rows">${rows.join('')}</div>${more}`;
}
function goalCard(c,x){
  const pr=x.pr,id=esc(pr.id),edit=W()&&!x.passed;
  if(!x.mode)return `<section class="card"><h2>Financement</h2><p class="note" style="margin-top:0">Tu connais la mensualité : l’appli calcule le budget. Tu listes les dépenses : l’appli calcule le prix du voyage, puis la mensualité.</p>${edit?`<div class="actions" style="margin-top:10px"><button class="btn block" data-act="goal-edit" data-id="${id}">Choisir le financement</button></div>`:''}</section>`;
  if(x.mode==='rest'){
    const tot=x.total||0,pctR=x.budget>0?Math.min(x.collected/x.budget*100,100):0;
    const rowsR=[
      row('Cotisation par personne',`${eur(tot)} / mois en tout`),
      row(`Mensualités<div class="note">${winText(x).replace(/^\d+ mensualités?, /,'')}</div>`,String(x.win.length)),
      ...(x.ledger.guestShare>0.005?[row(`Part des invités<div class="note">${esc(x.ledger.guests.map(g=>g.name).join(', '))} · s’ajoute au budget</div>`,'+ '+eur(x.ledger.guestShare))]:[]),
      row(`${x.ledger.guests.length?'Cotisants':'Participants'}<div class="note">${esc(namesOf(x.members))}</div>`,String(x.members.length)),
      row(`Déjà collecté<div class="bar" style="width:140px"><i style="width:${pctR}%"></i></div>`,eur(x.collected))
    ];
    let moreR=`<h3 class="mini">Ce qui va à ce voyage chaque mois</h3>${flowHtml(x)}<p class="note">Sur les ${eur(tot)} de chacun, le crédit passe d’abord, puis les voyages qui ont un prix ou une mensualité. Ce voyage prend le reste.</p>`;
    if(x.restZero.length&&!x.passed)moreR+=`<p class="warn">Certains mois, il ne reste rien pour ce voyage (${esc(namesOf(x.restZero))}) : les autres voyages prennent toute la part.</p>`;
    if(x.rateOff.length&&!x.passed)moreR+=`<p class="warn">La cotisation de ${esc(namesOf(x.rateOff))} n’est pas à ${eur(tot)} sur ces mois. Touche « Mettre à jour les cotisations ».</p>`;
    if(x.planned>x.budget+0.005)moreR+=`<p class="warn">Les dépenses prévues (${eur(x.planned)}) dépassent le budget de ${eur(x.planned-x.budget)}.</p>`;
    else if(x.planned>0)moreR+=`<p class="note">Dépenses prévues : ${eur(x.planned)}, il reste ${eur(x.budget-x.planned)}.</p>`;
    return `<section class="card"><h2>Financement <small>le reste de la cotisation</small></h2>
      <div class="goalbig"><span>Budget prévu</span><b>${eur(x.budget)}</b><span>avec ce qui reste des ${eur(tot)} de chacun${x.collected>0.005?` · ${eur(x.collected)} déjà collectés`:''}</span></div>
      <div class="rows">${rowsR.join('')}</div>${moreR}
      ${edit?`<div class="actions">${x.U>0?`<button class="btn" data-act="goal-apply" data-id="${id}">Mettre à jour les cotisations</button>`:''}<button class="btn ghost" data-act="goal-edit" data-id="${id}">Modifier</button></div>`:''}</section>`;
  }
  if(x.mode==='expenses'&&!x.goal)return `<section class="card"><h2>Financement <small>prix estimé avec les dépenses</small></h2><p class="note" style="margin-top:0">Ajoute les dépenses prévues (logement, essence, péages, courses…) : l’appli additionne pour estimer le prix, puis calcule la mensualité par personne.</p>${edit?`<div class="actions" style="margin-top:10px"><button class="btn" data-act="exp-new" data-id="${id}">Ajouter une dépense</button><button class="btn ghost" data-act="goal-edit" data-id="${id}">Modifier</button></div>`:''}</section>`;
  const m=x.members.length,cap=x.mode==='monthly'?x.budget:x.goal,pct=cap>0?Math.min(x.collected/cap*100,100):0;
  const names=x.members.map(i=>S.people[i]?S.people[i].name:'').filter(Boolean).join(', ');
  const crTxt=x.crCut>0&&x.crLast?`${eur(x.crCut)} pour le crédit jusqu’en ${mYear(x.crLast).toLowerCase()}`:'';
  const crIn=x.mode==='monthly'&&x.creditIn&&crTxt;
  let head;
  if(x.mode==='monthly')head=`<div class="goalbig"><span>Budget prévu</span><b>${eur(x.budget)}</b><span>avec ${eur(x.perMonth)} par personne et par mois${crIn?`, dont ${crTxt}`:!x.creditIn&&crTxt?`, plus ${crTxt}`:''}${x.collected>0.005?` · ${eur(x.collected)} déjà collectés`:''}</span></div>`;
  else if(x.toCollect<=0.005)head=`<p class="warn" style="background:var(--ok-soft);color:var(--ok);margin:0 0 12px">${x.ledger.guestShare>0.005?`Part des cotisants réunie : ${eur(x.collected-x.ledger.guestIn)} collectés.${x.ledger.toReceive>0.005?` Les invités doivent encore ${eur(x.ledger.toReceive)}.`:''}`:`Objectif atteint : ${eur(x.collected)} collectés.`}</p>`;
  else if(x.needed==null)head=`<p class="warn" style="margin:0 0 12px">Toutes les mensualités sont passées et il manque ${eur(x.toCollect)}.${W()?' <button class="linkbtn" data-act="extra-new">Virement exceptionnel</button>':''}</p>`;
  else{
    const per=ceilE(x.needed),exact=Math.abs(per-x.needed)>0.004;
    head=`<div class="goalbig"><span>À mettre par personne</span><b>${eur(per)}<small> / mois</small></b><span>${exact?`${eur(x.needed)} exactement · `:''}soit ${eur(per*m)} par mois pour ${m} ${x.ledger.guests.length?'cotisant':'participant'}${m>1?'s':''}</span></div>`;
    if(crTxt)head+=`<p class="note" style="margin:-6px 0 12px">Le crédit s’ajoute : + ${crTxt}.</p>`;
  }
  const rows=[
    x.mode==='goal'?row('Objectif',eur(x.goal)):x.mode==='expenses'?row(`Prix estimé<div class="note">total des ${x.exps.length} dépense${x.exps.length>1?'s':''} prévue${x.exps.length>1?'s':''}</div>`,eur(x.goal)):row(`Mensualité par personne${crIn?'<div class="note">crédit compris</div>':''}`,eur(x.perMonth)+' / mois'),
    ...(crIn?[row(`Pour le voyage<div class="note">le crédit finit en ${mYear(x.crLast).toLowerCase()}</div>`,x.crLast<x.win[x.win.length-1]?`${eur(Math.max(x.perMonth-x.crCut,0))} puis ${eur(x.perMonth)}`:eur(Math.max(x.perMonth-x.crCut,0)))]:[]),
    row(`Mensualités<div class="note">${winText(x).replace(/^\d+ mensualités?, /,'')}</div>`,String(x.win.length)),
    ...(x.ledger.guestShare>0.005?[row(`Part des invités<div class="note">${esc(x.ledger.guests.map(g=>g.name).join(', '))} · ${x.mode==='monthly'?'s’ajoute au budget':'payée à part'}</div>`,(x.mode==='monthly'?'+ ':'− ')+eur(x.ledger.guestShare))]:[]),
    row(`${x.ledger.guests.length?'Cotisants':'Participants'}<div class="note">${esc(names)}</div>`,String(m)),
    row(`Déjà collecté<div class="bar" style="width:140px"><i style="width:${pct}%"></i></div>`,eur(x.collected))
  ];
  let more='';
  const word=x.mode==='goal'?'l’objectif':x.mode==='expenses'?'le prix estimé':'le budget';
  if(x.mode==='expenses')more+=`<p class="note">Le prix suit les dépenses : ajoute ou modifie une ligne et la mensualité se recalcule.${x.rest.length?` ${restNames(x).charAt(0).toUpperCase()+restNames(x).slice(1)} n’${x.rest.length>1?'ont':'a'} pas de montant prévu et n’${x.rest.length>1?'entrent':'entre'} pas dans le prix.`:''}</p>`;
  if(!x.passed&&x.U>0&&(x.mode==='monthly'||(x.toCollect>0.005&&x.needed!=null))){
    const gap=r2(x.projected-cap);
    more+=gap>=-0.005?`<p class="note">Avec les cotisations actuelles, ${word} sera atteint${gap>0.005?` (+ ${eur(gap)})`:''}.</p>`:`<p class="note">Avec les cotisations actuelles, vous arriverez à ${eur(x.projected)} : il manquera ${eur(-gap)}. Mets à jour les cotisations.</p>`;
  }
  if(x.mode!=='monthly'&&x.toCollect>0.005&&x.needed!=null&&x.collected>0.005&&x.theo&&Math.abs(x.needed-x.theo)>=0.5)more+=`<p class="note">Au départ, c’était ${eur(x.theo)} par personne : le montant tient compte de ce qui a déjà été versé.</p>`;
  if(x.mode!=='expenses'&&x.planned>cap+0.005)more+=`<p class="warn">Les dépenses prévues (${eur(x.planned)}) dépassent ${word} de ${eur(x.planned-cap)}.</p>`;
  const btns=edit?`<div class="actions">${x.U>0&&x.target!=null?`<button class="btn" data-act="goal-apply" data-id="${id}">Mettre à jour les cotisations</button>`:''}<button class="btn ghost" data-act="goal-edit" data-id="${id}">Modifier</button></div>`:'';
  return `<section class="card"><h2>Financement <small>${x.mode==='goal'?'prix fixé':x.mode==='expenses'?'prix estimé avec les dépenses':'mensualité fixée'}</small></h2>${head}<div class="rows">${rows.join('')}</div>${more}${btns}</section>`;
}

function vHome(c){
  const st=S.settings;
  const owe=Object.values(c.owe).sort((a,b)=>b.total-a.total||String(a.p.name).localeCompare(String(b.p.name),'fr'));
  const oweTotal=owe.reduce((s,o)=>s+o.total,0);

function vPay(c){
  const st=S.settings,people=sortedPeople().filter(p=>p.active!==false),cm=c.cm;
  const winStart=S.showAll?c.start:[c.start,addMonth(cm,-5)].sort().pop();
  const shown=c.months.filter(m=>m>=winStart),hidden=c.months.length-shown.length;
  const dueNow=people.filter(p=>inPeriod(p,cm,c.start));
  const paidNow=dueNow.filter(p=>S.payments[payKey(p.id,cm)]).length;
  const cell=(p,m)=>{
    if(!inPeriod(p,m,c.start))return `<td><span class="cell off">·</span></td>`;
    const pay=S.payments[payKey(p.id,m)];
    let cls,txt,lab;
    const due=fmtN(rateFor(p,m).monthly);
    if(pay){cls='paid';txt=fmtN(pay.amount);lab='payé'}
    else if(m<cm){cls='late';txt=due;lab='en retard'}
    else if(m===cm){cls='due';txt=due;lab='à payer ce mois'}
    else{cls='future';txt=due;lab='à venir'}
    return `<td><button class="cell ${cls}" data-act="cell" data-p="${esc(p.id)}" data-m="${m}" aria-label="${esc(p.name)}, ${mLabel(m)} : ${lab}">${txt}</button></td>`;
  };
  const totals=people.map(p=>Object.values(S.payments).filter(x=>x.person===p.id).reduce((s,x)=>s+(+x.amount||0),0));
  const recent=Object.values(S.payments).sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.recordedAt).localeCompare(String(a.recordedAt))).slice(0,10);
  const extras=Object.values(S.extras).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const exTotal=extras.reduce((s,x)=>s+(+x.amount||0),0);
  const who=x=>x.person&&S.people[x.person]?S.people[x.person].name:'Plusieurs / autre';
  const moves=Object.values(S.moves).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const moveSide=x=>x.dir==='transfer'?'réserve crédit → '+esc(projName(x.project)):x.target==='voyages'?'compte pour '+esc(projName(x.project)):'compte pour la réserve crédit';
  return `
${W()?`<div class="toprow"><button class="btn" data-act="pay-new">Noter un versement</button><button class="btn ghost" data-act="extra-new">Virement exceptionnel</button></div>`:''}
<section class="card">
  <h2>Versements mensuels <small>${mLabel(cm)} : ${paidNow}/${dueNow.length} ont payé</small></h2>
  ${hidden?`<button class="linkbtn" data-act="show-all" style="margin-bottom:6px">Voir les ${hidden} mois d’avant</button>`:S.showAll&&c.start<addMonth(cm,-5)?`<button class="linkbtn" data-act="show-all" style="margin-bottom:6px">Masquer les anciens mois</button>`:''}
  <div class="gridwrap">
    <table class="grid">
      <thead><tr><th class="m"></th>${people.map(p=>`<th>${esc(p.name)}</th>`).join('')}</tr></thead>
      <tbody>${shown.map(m=>`<tr><td class="m${m===cm?' now':''}">${mLabel(m,1)}</td>${people.map(p=>cell(p,m)).join('')}</tr>`).join('')}</tbody>
      <tfoot><tr><td class="m">Total versé</td>${totals.map(t=>`<td>${fmtN(t)}</td>`).join('')}</tr></tfoot>
    </table>
  </div>
  <div class="legend"><span><i class="k-paid"></i>Payé</span><span><i class="k-due"></i>À payer ce mois</span><span><i class="k-late"></i>En retard</span><span><i class="k-future"></i>À venir</span></div>
  ${W()?`<p class="note">Touche une case pour noter ou corriger un versement.</p>`:''}
</section>
<section class="card">
  <h2>Virements exceptionnels <small>${extras.length?eur(exTotal)+' au total':''}</small></h2>
  ${extras.length?`<div class="rows">${extras.map(x=>`<div class="row"><div class="l"><b>${esc(who(x))}</b> · pour ${x.target==='credit'?'le crédit':esc(projName(x.project))}<div class="note">reçu le ${fmtDate(x.date)}${x.note?' · '+esc(x.note):''}</div></div><div class="r"><span>${eur(x.amount)}</span>${W()?`<button class="btn small ${S.delArm===x.id?'danger':'ghost'}" data-act="extra-del" data-id="${esc(x.id)}">${S.delArm===x.id?'Confirmer':'Retirer'}</button>`:''}</div></div>`).join('')}</div>`:`<p class="note">À utiliser quand il manque de l’argent pour un voyage ou pour le crédit : le virement s’ajoute à la cagnotte sans toucher aux mensualités.</p>`}
</section>
<section class="card">
  <h2>Autres mouvements du livret ${W()?`<button class="btn small ghost" data-act="move-new">+ Ajouter</button>`:''}</h2>
  ${moves.length?`<div class="rows">${moves.map(x=>`<div class="row"><div class="l"><b>${esc(x.label||'Mouvement')}</b><div class="note">${fmtDate(x.date)} · ${moveSide(x)}</div></div><div class="r"><span class="${x.dir==='out'?'neg':''}">${x.dir==='out'?'− ':x.dir==='in'?'+ ':''}${eur(x.amount)}</span>${W()?`<button class="btn small ${S.delArm===x.id?'danger':'ghost'}" data-act="move-del" data-id="${esc(x.id)}">${S.delArm===x.id?'Confirmer':'Retirer'}</button>`:''}</div></div>`).join('')}</div>`:`<p class="note">Pour ce qui n’est ni une mensualité ni une dépense de voyage : virement vers un compte courant, remboursement, intérêts…</p>`}
</section>

  <h2>Derniers versements</h2>
  ${recent.length?`<div class="rows">${recent.map(x=>`<div class="row"><div class="l"><b>${esc(S.people[x.person]?.name||x.person)}</b> · ${mLabel(x.month)}<div class="note">reçu le ${fmtDate(x.date)}${x.note?' · '+esc(x.note):''}</div></div><div class="r">${eur(x.amount)}</div></div>`).join('')}</div>`:`<p class="note">Aucun versement noté.</p>`}
</section>`;
}

function expRow(e,x){
  const paid=sumPay(e),id=esc(e.id);
  let right,chip,meta='',pct=null;
  if(e.rest){
    right=x.passed?eur(paid):`<span class="${x.available<0?'neg':''}">${eur(x.available)}</span> dispo`;
    chip='<span class="chip ok">Le reste du pot</span>';meta=paid?`dépensé ${eur(paid)}`:'rien dépensé pour l’instant';
  }else if(e.closed){right=eur(paid);chip='<span class="chip ok">Soldé</span>';pct=100}
  else if(e.planned==null){right='à estimer';chip='<span class="chip due">Sans montant</span>';meta=paid?`payé ${eur(paid)}`:''}
  else{
    const rem=Math.max(+e.planned-paid,0);right=eur(e.planned);
    chip=paid>0?'<span class="chip">Acompte versé</span>':'<span class="chip">À payer</span>';
    meta=`payé ${eur(paid)} · reste ${eur(rem)}`;pct=+e.planned>0?Math.min(paid/(+e.planned)*100,100):0;
  }
  const canPay=W()&&!e.closed&&!x.passed;
  return `<div class="exp"><button class="exp-main" data-act="exp" data-e="${id}"><div class="exp-top"><span class="exp-name">${esc(e.label)}</span><span class="exp-amt">${right}</span></div><div class="exp-meta">${chip}${meta?`<span class="muted">${meta}</span>`:''}</div>${pct!=null?`<div class="bar"><i style="width:${pct}%"></i></div>`:''}</button>${canPay?`<button class="btn small ghost" data-act="exp-pay" data-e="${id}">${e.rest?'+ Dépense':'Payer'}</button>`:''}</div>`;
}

/* Ce qu'il faut verser pour que tout le monde soit quitte : tout passe par la cagnotte. */
function settleSuggestions(x){
  const out=[];
  for(const [id,b] of Object.entries(x.ledger.bal)){if(b<-0.005)out.push({from:id,to:'pot',amount:r2(-b)});else if(b>0.005)out.push({from:'pot',to:id,amount:r2(b)})}
  return out.sort((a,b)=>(a.to==='pot'?0:1)-(b.to==='pot'?0:1)||b.amount-a.amount);
}
function settleText(pr,s){
  if(s.to==='pot')return `<b>${esc(partName(pr,s.from))}</b> verse ${eur(s.amount)} à la cagnotte`;
  if(s.from==='pot')return `La cagnotte rembourse ${eur(s.amount)} à <b>${esc(partName(pr,s.to))}</b>`;
  return `<b>${esc(partName(pr,s.from))}</b> donne ${eur(s.amount)} à <b>${esc(partName(pr,s.to))}</b>`;
}
function tricountCard(c,x){
  const pr=x.pr,L=x.ledger,id=esc(pr.id),edit=W();
  const gSet=new Set(L.guests.map(g=>g.id));
  const chips=L.parts.map(p=>{const g=gSet.has(p);return `<span class="pchip${g?' guest':''}">${esc(partName(pr,p))}${g?`<small>invité</small>${edit?`<button type="button" class="x" data-act="guest-del" data-pid="${id}" data-id="${esc(p)}" aria-label="Retirer ${esc(partName(pr,p))}">×</button>`:''}`:''}</span>`}).join('');
  let body='';
  if(L.active){
    const rowsP=L.parts.concat(Object.keys(L.bal).filter(i=>!L.parts.includes(i))).map(p=>{
      const g=gSet.has(p),b=L.bal[p]||0,paidBy=L.credit[p]||0;
      const sub=g?`a payé ${eur(Math.max(paidBy,0))}${paidBy<-0.005?` · a reçu ${eur(-paidBy)}`:''}`:(Math.abs(paidBy)>0.005?(paidBy>0?`a avancé ${eur(paidBy)}`:`a reçu ${eur(-paidBy)}`):'par la cagnotte');
      const st=b<-0.005?`<span class="neg">doit ${eur(-b)}</span>`:b>0.005?`<span class="pos">à recevoir ${eur(b)}</span>`:g?`<span class="pos">à jour</span>`:'';
      return row(`<b>${esc(partName(pr,p))}</b>${g?' <span class="chip">invité</span>':''}<div class="note">${sub}</div>`,`<span>${L.parts.includes(p)?eur(L.share[p]||0):'—'}</span>${st?`<small class="st">${st}</small>`:''}`);
    }).join('');
    const sug=settleSuggestions(x);
    body+=`<h3 class="mini">Part de chacun <small class="muted">${eur(L.cost)} de dépenses</small></h3><div class="rows">${rowsP}</div>
      <h3 class="mini">Pour être quittes</h3>
      ${sug.length?`<div class="rows">${sug.map((s,i)=>row(settleText(pr,s),edit?`<button class="btn small" data-act="settle-done" data-pid="${id}" data-i="${i}">C’est fait</button>`:'')).join('')}</div>`:`<p class="note" style="margin-top:2px">Tout le monde est quitte.</p>`}
      ${edit?`<button class="linkbtn" data-act="settle-new" data-pid="${id}" style="margin-top:6px">Noter un autre remboursement</button>`:''}
      ${L.settles.length?`<h3 class="mini">Remboursements notés</h3><div class="rows">${L.settles.map(s=>row(`${settleText(pr,s)}<div class="note">${fmtDate(s.date)}${s.note?' · '+esc(s.note):''}</div>`,edit?`<button class="btn small ${S.delArm===s.id?'danger':'ghost'}" data-act="settle-del" data-pid="${id}" data-id="${esc(s.id)}">${S.delArm===s.id?'Confirmer':'Retirer'}</button>`:'')).join('')}</div>`:''}
      <p class="note">Les dépenses pas encore payées comptent pour leur montant prévu. Les cotisants paient leur part avec la cagnotte.${x.mode==='goal'&&L.guests.length&&x.goal>L.cost+0.005?' Les invités paient leur part des dépenses notées : ajoute les dépenses prévues pour que leur part couvre tout le voyage.':''}</p>`;
  }else body=`<p class="note">Un membre de la famille vient sans cotiser chaque mois ? Ajoute-le comme invité : l’appli calcule sa part du voyage. Quand quelqu’un avance une dépense de sa poche, note-le au paiement : l’appli dit qui rembourse qui.</p>`;
  return `<section class="card">
  <h2>Participants et comptes <small>${L.parts.length} participant${L.parts.length>1?'s':''}${L.guests.length?` dont ${L.guests.length} invité${L.guests.length>1?'s':''}`:''}</small></h2>
  <div class="pchips">${chips}${edit?`<button type="button" class="pchip add" data-act="members" data-pid="${id}">+ Ajouter un participant</button>`:''}</div>
  ${body}
</section>`;
}

function vTrips(c){
  if(!c.order.length)return stateCard('Aucun projet','Crée un premier voyage pour suivre son budget.',W()?`<div class="actions" style="margin-top:10px"><button class="btn block" data-act="proj-new">Créer un projet</button></div>`:'');

  ${budgetBlock(c,x,true)}

</section>
${goalCard(c,x)}
<section class="card">
  <h2>Dépenses <small>${x.exps.length?x.exps.length+' ligne'+(x.exps.length>1?'s':''):''}</small></h2>

  ${W()?`<div class="actions" style="margin-top:10px">${!x.passed?`<button class="btn" data-act="exp-new" data-id="${esc(sid)}">Ajouter une dépense</button>`:''}${x.exps.length?`<button class="btn ghost" data-act="exp-bulk" data-id="${esc(sid)}">Modifier les dépenses</button>`:''}</div>`:''}

let pendingRender=false;
const isTyping=root=>{const a=document.activeElement;return !!(a&&root.contains(a)&&a.matches&&a.matches('input,select,textarea'))};
function route(){const h=(location.hash||'').slice(1);if(h==='ski')return 'voyages';return ROUTES.includes(h)?h:'accueil'}
function allReady(){return Object.values(S.ready).every(Boolean)}
function render(){
  if(isTyping(view)){pendingRender=true;return}
  pendingRender=false;
  const r=route();
  document.querySelectorAll('.tabs a').forEach(a=>{if(a.dataset.route===r)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  tripEl.textContent='';
  if(S.status==='nodb'){view.innerHTML=stateCard('Données indisponibles ici','La cagnotte s’ouvre depuis Claude, connecté à ton compte. Dans cette vue, ses données ne peuvent pas être chargées.');return}
  if(S.status==='error'){view.innerHTML=stateCard('La cagnotte ne répond plus','Recharge la page. Si ça persiste, vérifie que tu as toujours accès à cette page.');return}
  if(!allReady()){view.innerHTML=S.status==='slow'?stateCard('La cagnotte ne répond pas encore','Vérifie ta connexion. Les chiffres s’afficheront dès qu’elle répond.'):stateCard('Chargement de la cagnotte…','Versements, voyages et solde du livret arrivent.');return}
  if(!S.settings){view.innerHTML=stateCard('Bienvenue dans La Cagnotte','Importe ton fichier de données (cagnotte-donnees.json) ou une sauvegarde. Tu peux aussi commencer une cagnotte vide.',`<div class="actions" style="margin-top:10px"><button class="btn block" data-act="import">Importer mes données</button><button class="btn ghost block" data-act="init">Commencer à zéro</button></div>`);return}
  const c=calc();
  const cur=c.current&&c.proj[c.current];
  if(cur)tripEl.textContent=cur.pr.name+(cur.pr.month?' · '+MOIS_C[+cur.pr.month.slice(5)-1]+' '+cur.pr.month.slice(2,4):'');
  view.innerHTML=r==='versements'?vPay(c):r==='voyages'?vTrips(c):r==='reglages'?vSet(c):vHome(c);
}
function refresh(){render();if(sheetState&&sheetState.live&&!isTyping(sheetEl))drawSheet();if(!notesCleaned&&allReady())setTimeout(cleanCopiedNotes,0)}
view.addEventListener('focusout',()=>{if(pendingRender)setTimeout(()=>{if(!isTyping(view))render()},0)});

/* ---------- toast & writes ---------- */
let tt;
function toast(msg){toastEl.textContent=msg;toastEl.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{toastEl.hidden=true},2400)}
async function w(fn,okMsg){
  if(!W()){toast('Lecture seule : tu ne peux pas modifier la cagnotte');return false}
  try{await fn();if(okMsg)toast(okMsg);return true}
  catch(e){
    console.error(e);
    const code=e&&e.code;
    toast(code==='invalid_argument'?'Modification refusée':code==='quota_exceeded'?'Cagnotte pleine : supprime d’anciennes lignes':'Pas enregistré, réessaie');
    if(code==='invalid_argument'&&S.db){S.canWrite=false;refresh()}
    return false;
  }
}
async function recordPayments(pid,months,each,date,note){
  const p=S.people[pid];const at=new Date().toISOString();
  for(const m of months){
    const amt=each==null?rateFor(p,m).monthly:each;
    const sp=splitFor(p,m,amt);
    await S.db.doc('payments/'+payKey(pid,m)).set({person:pid,month:m,amount:r2(amt),ski:sp.ski,credit:sp.credit,date,note:note||'',recordedAt:at});
  }
}

/* ---------- sheets ---------- */
let sheetState=null;
function openSheet(st){const wasOpen=!!sheetState;sheetState=st;drawSheet();sheetEl.hidden=false;backdrop.hidden=false;sheetEl.scrollTop=0;if(!wasOpen)requestAnimationFrame(()=>requestAnimationFrame(()=>sheetEl.classList.add('open')))}
function drawSheet(){if(!sheetState)return;sheetBody.innerHTML=sheetState.render();addCalcKeys(sheetBody);if(sheetState.bind)sheetState.bind(sheetBody)}
/* Touches de calcul : sous chaque champ data-calc, ou une seule rangée sous un bloc data-calc-host (lignes du questionnaire). */
let lastCalc=null;
const CALC_OPS=[['+','plus'],['−','moins'],['×','fois'],['÷','divisé par']];
function calcKeysHtml(forId){return `<div class="calckeys"${forId?` data-for="${forId}"`:''}>${CALC_OPS.map(([o,l])=>`<button type="button" data-ck="${o}" aria-label="${l}">${o}</button>`).join('')}<span class="calcres" aria-live="polite"></span></div>`}
function addCalcKeys(root){
  root.querySelectorAll('input[data-calc]').forEach(inp=>{if(!inp.closest('[data-calc-host]'))inp.insertAdjacentHTML('afterend',calcKeysHtml(inp.id))});
  root.querySelectorAll('[data-calc-host]').forEach(h=>h.insertAdjacentHTML('afterend',calcKeysHtml('')));
  root.querySelectorAll('input[data-calc]').forEach(calcShow);
}
function calcRow(inp){const h=inp.closest('[data-calc-host]');const r=h?h.nextElementSibling:inp.nextElementSibling;return r&&r.classList.contains('calckeys')?r:null}
function calcTarget(row){const id=row.dataset.for;if(id)return sheetBody.querySelector('#'+id);if(lastCalc&&sheetBody.contains(lastCalc)&&calcRow(lastCalc)===row)return lastCalc;const h=row.previousElementSibling;const all=h?[...h.querySelectorAll('input[data-calc]')]:[];return all.find(i=>i.value.trim())?all.filter(i=>i.value.trim()).pop():all[0]}
function calcShow(inp){
  if(!inp)return;const row=calcRow(inp),out=row&&row.querySelector('.calcres');if(!out)return;
  if(row.dataset.for===undefined&&lastCalc&&lastCalc!==inp&&calcRow(lastCalc)===row&&sheetBody.contains(lastCalc))return;
  const v=inp.value,r=calcExpr(v),isC=hasOp(v)||/[x×*÷\/+\-−]\s*$/.test(v.trim());
  out.textContent=isC?(r!=null?'= '+eur(r2(r)):'calcul à finir'):'';
  out.classList.toggle('bad',isC&&r==null);
}
function calcInsert(inp,op){
  const v=inp.value,focused=document.activeElement===inp;
  const a=focused&&inp.selectionStart!=null?inp.selectionStart:v.length,b=focused&&inp.selectionEnd!=null?inp.selectionEnd:v.length;
  let pre=v.slice(0,a).replace(/\s+$/,'');const post=v.slice(b).replace(/^\s+/,'');
  if(/[+\-−×x*÷\/]$/i.test(pre))pre=pre.slice(0,-1).replace(/\s+$/,'');
  if(!pre){inp.focus();toast('Tape d’abord un montant');return}
  const ins=' '+op+' ';inp.value=pre+ins+post;
  const pos=(pre+ins).length;inp.focus();try{inp.setSelectionRange(pos,pos)}catch(e){}
  lastCalc=inp;inp.dispatchEvent(new Event('input',{bubbles:true}));
}
sheetBody.addEventListener('pointerdown',e=>{if(e.target.closest('[data-ck]'))e.preventDefault()});
sheetBody.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('input[data-calc]')){lastCalc=e.target;calcShow(e.target)}});
sheetBody.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('input[data-calc]'))calcShow(e.target)});
sheetBody.addEventListener('click',e=>{const k=e.target.closest('[data-ck]');if(!k)return;e.preventDefault();const inp=calcTarget(k.closest('.calckeys'));if(inp)calcInsert(inp,k.dataset.ck)});
function closeSheet(){sheetState=null;sheetEl.classList.remove('open');backdrop.hidden=true;setTimeout(()=>{if(!sheetState){sheetEl.hidden=true;sheetBody.innerHTML=''}},240)}
backdrop.addEventListener('click',closeSheet);
$('#sheet-close').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetState)closeSheet()});
sheetBody.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||!sheetState||!sheetState.act)return;const fn=sheetState.act[b.dataset.act];if(fn){e.preventDefault();fn(b)}});
function bindInputs(root,map,obj){Object.keys(map).forEach(id=>{const el=root.querySelector('#'+id);if(!el)return;el.addEventListener(el.type==='checkbox'||el.tagName==='SELECT'?'change':'input',ev=>{obj[map[id]]=el.type==='checkbox'?el.checked:ev.target.value})})}
const seg=(act,cur,opts)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button type="button" data-act="${act}" data-v="${v}" aria-pressed="${cur===v}">${l}</button>`).join('')}</div>`;

function unpaidMonths(pid){
  const st=S.settings,p=S.people[pid];if(!p)return [];
  const cm=todayStr().slice(0,7);const end=[st.endMonth||cm,addMonth(cm,2)].sort().pop();
  return monthsBetween(st.startMonth,end).filter(m=>inPeriod(p,m,st.startMonth)&&!S.payments[payKey(pid,m)]);

function sheetPay(o={}){
  const people=sortedPeople().filter(p=>p.active!==false);
  if(!people.length){toast('Ajoute d’abord un cotisant');return}
  const c=calc();const firstOwe=Object.values(c.owe)[0];
  let pid=o.pid||(firstOwe&&firstOwe.p.id)||people[0].id;
  let sel=new Set(o.months||[]);
  if(!o.months){const u=unpaidMonths(pid);if(u[0])sel.add(u[0])}
  let date=todayStr(),note='',amount=null;
  const rateM=m=>rateFor(S.people[pid]||{},m).monthly;
  const each=()=>amount!=null?amount:rateM([...sel].sort()[0]||todayStr().slice(0,7));
  const total=()=>amount!=null?amount*sel.size:[...sel].reduce((s,m)=>s+rateM(m),0);
  const mixed=()=>amount==null&&new Set([...sel].map(rateM)).size>1;
  openSheet({live:true,
    render(){
      const p=S.people[pid],u=unpaidMonths(pid),cm=todayStr().slice(0,7);
      [...sel].forEach(m=>{if(!u.includes(m))sel.delete(m)});
      return `<h3>Noter un versement</h3><p class="lead">Le versement mensuel de 150 € d’un cotisant.</p>
      <div class="field"><label for="sp-p">Qui a payé ?</label><select id="sp-p">${people.map(x=>`<option value="${esc(x.id)}" ${x.id===pid?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div class="field"><span class="flabel">Pour quel(s) mois ?</span>${u.length?`<div class="pick">${u.map(m=>`<button type="button" data-act="sp-m" data-m="${m}" aria-pressed="${sel.has(m)}" class="${m<cm?'late':m===cm?'due':''}">${mLabel(m,1)}</button>`).join('')}</div>`:`<p class="note">${esc(p&&p.name)} est à jour.</p>`}</div>
      <div class="fields2">
        <div class="field"><label for="sp-a">Montant par mois (€)</label><input id="sp-a" inputmode="decimal" value="${fmtN(each())}"></div>
        <div class="field"><label for="sp-d">Reçu le</label><input id="sp-d" type="date" value="${date}"></div>
      </div>
      ${mixed()?`<p class="note" style="margin:-6px 0 12px">Chaque mois est compté au montant de sa cotisation.</p>`:''}
      <div class="field"><label for="sp-n">Note (facultatif)</label><input id="sp-n" value="${esc(note)}" placeholder="ex. virement groupé"></div>
      <div class="actions"><button class="btn block" data-act="sp-save" ${sel.size?'':'disabled'}>Enregistrer ${sel.size} mois · <span id="sp-t">${eur(total())}</span></button></div>`;
    },
    bind(root){
      const sp=root.querySelector('#sp-p');if(sp)sp.addEventListener('change',e=>{pid=e.target.value;sel=new Set();amount=null;const u=unpaidMonths(pid);if(u[0])sel.add(u[0]);drawSheet()});
      const a=root.querySelector('#sp-a');if(a)a.addEventListener('input',e=>{const v=num(e.target.value);amount=v==null?0:v;const t=root.querySelector('#sp-t');if(t)t.textContent=eur(amount*sel.size)});
      const d=root.querySelector('#sp-d');if(d)d.addEventListener('input',e=>{date=e.target.value||todayStr()});
      const n=root.querySelector('#sp-n');if(n)n.addEventListener('input',e=>{note=e.target.value});
    },
    act:{
      'sp-m':b=>{const m=b.dataset.m;if(sel.has(m))sel.delete(m);else sel.add(m);drawSheet()},
      'sp-save':async b=>{
        const p=S.people[pid],ms=[...sel].sort();
        if(amount!=null&&!(amount>0)){toast('Montant invalide');return}
        if(!ms.length)return;
        b.disabled=true;
        const ok=await w(()=>recordPayments(pid,ms,amount,date,note.trim()));
        if(ok){
          const tot=amount!=null?amount*ms.length:ms.reduce((s,m)=>s+rateM(m),0);
          toast(`${p.name} : ${ms.length} mois noté${ms.length>1?'s':''}`);
          sheetNotify({kind:'pay',pid,name:p.name,months:ms,total:tot});
        }else b.disabled=false;
      }
    }});
}
function sheetCell(pid,m){
  const p=S.people[pid];if(!p)return;
  if(!S.payments[payKey(pid,m)]){if(W())sheetPay({pid,months:[m]});else toast(`${p.name} · ${mLabel(m)} : pas encore payé`);return}
  let confirm=false;
  openSheet({live:true,
    render(){
      const pay=S.payments[payKey(pid,m)];

      return `<h3>${esc(p.name)} · ${mLabel(m)}</h3>

    }});
