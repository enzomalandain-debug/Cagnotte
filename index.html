function sheetProject(pid){
  const isNew=!pid,p0=isNew?{}:S.projects[pid]||{};
  const f={name:p0.name||'',month:p0.month||'',startDate:p0.startDate||'',endDate:p0.endDate||'',note:p0.note||''};let confirmDel=false;
  /* Suppression : le projet part avec ses dépenses. On montre avant ce qui change vraiment. */
  const delInfo=()=>{
    const exps=Object.values(S.expenses).filter(e=>expProject(e)===pid),pr=S.projects[pid]||{};
    const pays=exps.reduce((n,e)=>n+(e.payments||[]).length,0),settles=(pr.settles||[]).length;
    const links=Object.values(S.extras).filter(x=>x.project===pid).length+Object.values(S.moves).filter(x=>x.project===pid).length+Object.values(S.allocs).filter(a=>a.from===pid||a.to===pid).length;
    const before=calc(),se=S.expenses,sp=S.projects,keep=new Set(Object.keys(se).filter(k=>expProject(se[k])!==pid));
    let after;S.expenses=Object.fromEntries(Object.entries(se).filter(([k])=>keep.has(k)));S.projects=Object.fromEntries(Object.entries(sp).filter(([k])=>k!==pid));
    try{after=calc()}finally{S.expenses=se;S.projects=sp}
    return {exps,pays,settles,links,funded:!!pr.mode,estBefore:before.est,estAfter:after.est};
  };
  const delBlock=()=>{
    if(!confirmDel)return `<div class="actions"><button class="btn ghost block" data-act="pj-del" style="color:var(--late)">Supprimer le projet</button></div>`;
    const d=delInfo(),li=[];
    if(d.exps.length)li.push(`${d.exps.length} dépense${d.exps.length>1?'s':''} (${esc(d.exps.map(e=>e.label).join(', '))}) ${d.exps.length>1?'seront supprimées':'sera supprimée'} avec.`);
    if(d.pays)li.push(`${d.pays} paiement${d.pays>1?'s':''} noté${d.pays>1?'s':''} sur ces dépenses ${d.pays>1?'seront effacés':'sera effacé'}.`);
    if(d.settles)li.push(`${d.settles} remboursement${d.settles>1?'s':''} noté${d.settles>1?'s':''} ${d.settles>1?'seront effacés':'sera effacé'}.`);
    if(Math.abs(d.estAfter-d.estBefore)>0.005)li.push(`<b>Le solde estimé du livret passera de ${eur(d.estBefore)} à ${eur(d.estAfter)}.</b>`);
    else li.push('Le solde du livret ne change pas.');
    if(d.links)li.push(`${d.links} virement${d.links>1?'s':''} ou transfert${d.links>1?'s':''} lié${d.links>1?'s':''} à ce projet ${d.links>1?'restent':'reste'} dans la cagnotte, en « Non affecté ».`);
    if(d.funded)li.push('Si tu as touché « Mettre à jour les cotisations » sur ce projet, vérifie ensuite les cotisations dans Réglages.');
    return `<div class="warn" style="margin-top:14px"><b>Supprimer ${esc(f.name||'ce projet')} ?</b><ul class="dellist">${li.map(t=>`<li>${t}</li>`).join('')}</ul></div>
      <div class="actions"><button class="btn danger" data-act="pj-del">Supprimer définitivement</button><button class="btn ghost" data-act="pj-del-no">Annuler</button></div>`;
  };
  openSheet({
    render(){
      return `<h3>${isNew?'Nouveau projet':'Modifier le projet'}</h3><p class="lead">Chaque voyage a son propre budget. Ce qui reste à la fin ne passe pas tout seul au suivant : tu le transfères à la main.</p>

/* ---------- objectif ---------- */
function goalPreview(pid,g,first,n,mem){
  const start=S.settings.startMonth,last=addMonth(first,n-1),ms=monthsBetween(first,last);
  let colx=0,U=0;
  for(const pay of Object.values(S.payments))if(mem.has(pay.person)&&pay.month>=first&&pay.month<=last)colx+=+pay.ski||0;
  if(pid){
    for(const x of Object.values(S.extras))if(x.target!=='credit'&&x.project===pid)colx+=+x.amount||0;
    for(const x of Object.values(S.moves)){if(x.project!==pid)continue;const a=+x.amount||0;if(x.dir==='transfer')colx+=a;else if(x.target==='voyages')colx+=(x.dir==='in'?1:-1)*a}
    for(const x of Object.values(S.allocs)){const a=+x.amount||0;if(x.to===pid)colx+=a;if(x.from===pid)colx-=a}
  }
  /* part crédit encore libre : un projet « crédit compris » commencé avant celui-ci l'a peut-être déjà prise */
  const c=calc(),before=c.crOrder.filter(id=>id!==pid).map(id=>c.proj[id]).filter(q=>q.win.length&&(q.win[0]<first||(q.win[0]===first&&(!pid||byOrder(q.pr,S.projects[pid])<0))));
  const crs=[];let crLast=null;
  for(const id of mem){const p=S.people[id];if(!p)continue;for(const m of ms)if(inPeriod(p,m,start)&&!S.payments[payKey(id,m)]){
    U++;let cr=shareFor(p,m).credit;
    for(const q of before)if(q.win.includes(m)&&q.members.includes(id))cr-=Math.min(cr,q.perMonth);
    crs.push(cr);if(cr>0&&(!crLast||m>crLast))crLast=m;
  }}
  const cnt={};crs.forEach(v=>{if(v>0)cnt[v]=(cnt[v]||0)+1});
  const crCut=Object.keys(cnt).length?+Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]:0;
  /* budget d'une mensualité fixe, en retirant la part crédit si elle est comprise dedans */
  const budget=(per,ci)=>r2(colx+crs.reduce((s,cr)=>s+Math.max(per-(ci?cr:0),0),0));
  return {ms,colx:r2(colx),U,theo:g/(n*mem.size),need:U>0?Math.max(g-colx,0)/U:null,crCut,crLast,budget};
}
/* Case « crédit compris » pour une mensualité fixe : visible seulement si le crédit court pendant ces mois. */
function creditBox(act,p,on){
  if(!p||!(p.crCut>0&&p.crLast))return '';
  const t=`${eur(p.crCut)}`,end=mYear(p.crLast).toLowerCase();
  return `<div class="checks" style="margin:0 0 12px"><label class="check"><input id="${act}" data-act="${act}" type="checkbox" ${on?'checked':''}> Le crédit est compris dedans</label></div>
    <p class="note" style="margin:-8px 0 12px">${on?`Jusqu’en ${end}, ${t} de chaque mensualité partent au crédit : le budget du voyage les retire tout seul.`:`Le crédit (${t} jusqu’en ${end}) sera ajouté en plus de cette mensualité.`}</p>`;
}
function overlapNames(c,pid,ms,mem){
  return c.order.filter(id=>id!==pid&&!c.proj[id].passed&&c.proj[id].win.some(m=>ms.includes(m))&&c.proj[id].members.some(i=>mem.has(i))).map(id=>esc(c.proj[id].pr.name));
}
/* « 120 x 2 » ou « 120*2 » pour un aller-retour */
function numExpr(v){return num(v)}
/* Premier mois que personne n'a encore payé : un nouveau projet ne reprend pas des versements déjà faits pour un autre. */
function nextFreeMonth(){const nx=addMonth(todayStr().slice(0,7)),lp=Object.values(S.payments).map(p=>p.month).sort().pop();return lp&&addMonth(lp)>nx?addMonth(lp):nx}
const TRIP_KINDS=[
  ['ski','Ski',['Logement','Gazole','Péages','Courses','Restaurants'],['Location véhicule','Forfaits','Location matériel','Activités']],
  ['mer','Mer / été',['Logement','Gazole','Péages','Courses','Restaurants'],['Activités','Location véhicule']],
  ['avion','Avion / étranger',['Billets d’avion','Hôtel','Restaurants','Activités'],['Transferts','Location véhicule','Assurance voyage','Courses']],
  ['ville','Ville / week-end',['Train','Hôtel','Restaurants'],['Visites','Activités','Gazole','Péages']],
  ['autre','Autre',['Logement','Transport','Courses','Restaurants'],['Activités','Gazole','Péages']]
];

    if(mm)return mm;

      h=`<b>Budget prévu : ${eur(x2.budget)}</b>${info}${x2.restZero.length?`<br><span class="neg">Certains mois, il ne reste rien pour ce voyage (${esc(namesOf(x2.restZero))}).</span>`:''}`;
      tail=`<div class="restflow"><span>Ce qui va à ce voyage chaque mois</span>${flowHtml(x2)}</div>`;
    }
    else if(f.mode!=='monthly'){
      const pre=f.mode==='expenses'?`Prix estimé : ${eur(g)} (${nExp} dépense${nExp>1?'s':''}). `:'';
      if(p.need==null)h=(p.colx>=g?'<b>Objectif déjà atteint</b>':`<b>Il manque ${eur(g-p.colx)}</b>Toutes les mensualités de cette période sont déjà payées. `)+pre+info;
      else{const per=ceilE(p.need);h=`<b>${eur(per)} par personne et par mois</b>${pre}${info}${Math.abs(per-p.need)>0.004?` ${eur(p.need)} exactement.`:''}${p.colx>0.005?`<br>Déjà versé sur ces mois : ${eur(p.colx)}. Sans ça, ce serait ${eur(p.theo)} par personne.`:''}`}
      if(f.mode==='goal'&&plannedTot>g+0.005)h+=`<br><span class="neg">Les dépenses prévues (${eur(plannedTot)}) dépassent ce prix de ${eur(plannedTot-g)}.</span>`;
    }else{
      const per=num(f.per),ci=f.ci&&p.crCut>0,budget=p.budget(per,ci);

    }

      <div class="fields2">

      const els=['gl-g','gl-p','gl-tt','gl-f','gl-t'].map(i=>root.querySelector('#'+i)).filter(Boolean),out=root.querySelector('#gl-res');

        b.disabled=true;

        if(ok){S.sel=pid;closeSheet()}else b.disabled=false;

        if(ok)closeSheet();
      }
    }});
}

          <div class="field"><label for="wz-tt">Chacun met en tout par mois (€)</label><input id="wz-tt" inputmode="decimal" value="${esc(f.total)}" placeholder="ex. 150"></div>
          <p class="note" style="margin:-4px 0 12px">La cotisation ne bouge pas. Le crédit passe d’abord, puis les voyages qui ont un prix ou une mensualité (ex. le ski). Ce voyage prend ce qui reste.</p>
          <div class="actions">${back}<button class="btn" data-act="wz-next">Suivant</button></div>`;
      if(f.step===3&&f.choice==='monthly')return `${head(3,'La mensualité')}

          ${+S.settings.creditMonthly>0&&S.settings.creditEndMonth&&S.settings.creditEndMonth>=f.first?`<p class="note" style="margin:-4px 0 12px">Mets ce que chacun verse en tout. Tant que le crédit court, sa part est retirée du budget du voyage.</p>`:''}
          <div class="actions">${back}<button class="btn" data-act="wz-next">Suivant</button></div>`;
      if(f.step===3)return `${head(3,'Le prix du voyage')}
          <div class="field"><label for="wz-g">Prix total (€)</label><input id="wz-g" inputmode="decimal" data-calc value="${esc(f.goal)}" placeholder="ex. 6000"></div>
          <div class="actions">${back}<button class="btn" data-act="wz-next">Suivant</button></div>`;
      return `${head(4,'Les mensualités')}
        <div class="fields2">
          <div class="field"><label for="wz-f">Début des cotisations</label><input id="wz-f" type="month" value="${esc(f.first)}"></div>
          <div class="field"><label for="wz-t">Mois du voyage</label><input id="wz-t" type="month" value="${esc(f.month)}"></div>
        </div>
        <span class="flabel">Dernier versement</span>${seg('wz-last',f.last,[['trip','Le mois du voyage'],['before','Le mois d’avant']])}
        <span class="flabel">Qui participe ?</span>
        <div class="pick" style="margin:4px 0 14px">${people.map(p=>`<button type="button" data-act="wz-m" data-id="${esc(p.id)}" aria-pressed="${f.mem.has(p.id)}">${esc(p.name)}</button>`).join('')}</div>
        <div id="wz-cr">${crBox()}</div>
        <div class="goalres" id="wz-res">${res4()}</div>
        <p class="note" style="margin:0 0 6px">Ensuite, « Mettre à jour les cotisations » applique la mensualité à chacun.</p>
        <div class="actions">${back}<button class="btn" data-act="wz-save">Créer le projet</button></div>`;
    },
    bind(root){
      const on=(id,fn)=>{const el=root.querySelector('#'+id);if(el){el.addEventListener('input',fn);el.addEventListener('change',fn)}};
      on('wz-n',e=>{f.name=e.target.value});on('wz-m',e=>{f.month=e.target.value});
      on('wz-p',e=>{f.per=e.target.value});on('wz-g',e=>{f.goal=e.target.value});on('wz-tt',e=>{f.total=e.target.value});
      root.querySelectorAll('#wz-lines input').forEach(el=>el.addEventListener('input',()=>{f.lines[+el.dataset.i][el.dataset.k]=el.value;const t=root.querySelector('#wz-tot');if(t)t.textContent=eur(total())}));
      const upd=()=>{const o=root.querySelector('#wz-res');if(o)o.innerHTML=res4();const cb=root.querySelector('#wz-cr');if(cb)cb.innerHTML=crBox()};
      on('wz-f',e=>{f.first=e.target.value;upd()});on('wz-t',e=>{f.month=e.target.value;upd()});
    },
    act:{
      'wz-kind':b=>{f.kind=f.kind===b.dataset.v?null:b.dataset.v;drawSheet()},
      'wz-ci':()=>{f.ci=!f.ci;drawSheet()},
      'wz-last':b=>{f.last=b.dataset.v;drawSheet()},
      'wz-back':()=>{f.step=Math.max(1,f.step-1);drawSheet()},
      'wz-choice':b=>{
        f.choice=b.dataset.v;
        if(f.choice==='expenses'&&f.linesKind!==f.kind&&f.lines.every(l=>!String(l.amount).trim())){f.lines=kindOf(f.kind)[2].map(l=>({label:l,amount:''}));f.linesKind=f.kind}
        f.step=3;drawSheet();
      },
      'wz-add':b=>{const lb=b.dataset.v||'';f.lines.push({label:lb,amount:''});drawSheet();const i=f.lines.length-1;setTimeout(()=>{const el=sheetBody.querySelector('#wz-'+(lb?'a':'l')+i);if(el)el.focus()},0)},
      'wz-rm':b=>{f.lines.splice(+b.dataset.i,1);drawSheet()},
      'wz-m':b=>{const id=b.dataset.id;if(f.mem.has(id))f.mem.delete(id);else f.mem.add(id);drawSheet()},
      'wz-next':()=>{
        if(f.step===1){
          if(!f.name.trim()){toast('Donne un nom au projet');return}
          if(f.month&&!/^\d{4}-\d{2}$/.test(f.month)){toast('Mois invalide');return}
          if(!f.kind&&/ski/i.test(f.name))f.kind='ski';
          f.step=2;drawSheet();return;
        }
        if(f.step===3){
          if(f.choice==='expenses'&&!(total()>0)){toast('Indique au moins un montant');return}
          if(f.choice==='monthly'&&!(num(f.per)>0)){toast('Indique la mensualité par personne');return}
          if(f.choice==='rest'&&!(num(f.total)>0)){toast('Indique ce que chacun met en tout');return}
          if(f.choice==='goal'&&!(num(f.goal)>0)){toast('Indique le prix du voyage');return}
          f.step=4;drawSheet();
        }
      },
      'wz-save':async b=>{
        const n=nOf(),mm=monthsMsg(f.first,f.month,f.last);
        if(mm){toast(mm.replace(/\.$/,''));return}
        if(!f.mem.size){toast('Choisis au moins un participant');return}
        const name=f.name.trim(),id=slug(name),order=Math.max(0,...Object.values(S.projects).map(x=>+x.order||0))+1;
        const data={name,month:f.month||null,startDate:null,endDate:null,note:'',order,firstMonth:f.first,endRule:f.last,installments:n,members:sortedPeople().map(p=>p.id).filter(i=>f.mem.has(i))};
        if(f.choice==='monthly')Object.assign(data,{mode:'monthly',perMonth:r2(num(f.per)),creditIncluded:f.ci});
        else if(f.choice==='rest')Object.assign(data,{mode:'rest',total:r2(num(f.total))});
        else if(f.choice==='goal')Object.assign(data,{mode:'goal',goal:r2(num(f.goal))});
        else data.mode='expenses';
        const lines=f.choice==='expenses'?f.lines.filter(l=>numExpr(l.amount)>0):[];
        let eo=Math.max(0,...Object.values(S.expenses).map(x=>+x.order||0));
        b.disabled=true;
        const ok=await w(async()=>{
          await freezeLegacy(null);
          await S.db.doc('projects/'+id).set(data);
          for(const l of lines){eo++;await S.db.doc('expenses/'+newId('e')).set({project:id,label:l.label.trim()||'Autre dépense',planned:r2(numExpr(l.amount)),rest:false,closed:false,note:hasOp(l.amount)?prettyExpr(l.amount):'',order:eo,payments:[]})}
        });
        if(ok){S.sel=id;closeSheet();toast('Projet créé');if(route()!=='voyages')location.hash='voyages';else render()}else b.disabled=false;
      }
    }});
}

/* Cotisation de chacun = somme des mensualités des projets en cours auxquels il participe + part crédit. */
function sheetApplyAll(){
  const c=calc(),ce=S.settings.creditEndMonth||null;
  const live=c.order.map(id=>c.proj[id]).filter(x=>!x.passed&&x.win.length);
  const withF=live.filter(x=>x.target!=null),restP=live.filter(x=>x.mode==='rest'),noF=live.filter(x=>!x.mode);
  const allF=withF.concat(restP);
  if(!allF.length){toast('Aucun projet avec un financement');return}
  const lastM=allF.map(x=>x.win[x.win.length-1]).sort().pop();
  let F0=[c.cm,allF.map(x=>x.win[0]).sort()[0]].sort().pop();
  const nfEnd=noF.map(x=>x.win[x.win.length-1]).filter(e=>e>=F0&&e<lastM).sort().pop();
  if(nfEnd)F0=addMonth(nfEnd);
  const people=sortedPeople().filter(p=>allF.some(x=>x.members.includes(p.id)));
  const f={from:F0};
  const schedule=p=>{
    const crBase=(ce&&f.from>ce)?0:rateFor(p,f.from).credit,segs=[];
    for(const m of monthsBetween(f.from,lastM)){
      const credit=(ce&&m>ce)?0:crBase;let cr=credit;const cut={};
      /* mensualité « crédit compris » : la part crédit est prise dedans, pas ajoutée en plus */
      for(const id of c.crOrder){const x=c.proj[id];if(!withF.includes(x)||!x.win.includes(m)||!x.members.includes(p.id))continue;const d=Math.min(cr,x.target);cut[id]=d;cr-=d}
      const parts=withF.filter(x=>x.win.includes(m)&&x.members.includes(p.id)).map(x=>[x.pr.name,r2(x.target-(cut[x.pr.id]||0))]);
      let ski=r2(parts.reduce((s,z)=>s+z[1],0)),over=0;
      /* projets « le reste » : la cotisation reste au total choisi, ils prennent ce qui reste après le crédit et les autres */
      const rIn=restP.filter(x=>x.win.includes(m)&&x.members.includes(p.id));
      if(rIn.length){
        const tot=Math.max(...rIn.map(x=>x.total||0)),left=r2(tot-credit-ski);
        if(left<-0.005){over=r2(-left);ski=r2(Math.max(tot-credit,0))}
        else{const each=r2(left/rIn.length);rIn.forEach(x=>parts.push([x.pr.name,each]));ski=r2(ski+left)}
      }
      const key=ski+'|'+credit+'|'+over+'|'+parts.map(z=>z[0]+z[1]).join(',');
      const lst=segs[segs.length-1];
      if(lst&&lst.key===key)lst.to=m;else segs.push({key,from:m,to:m,ski,credit,parts,over});
    }
    return segs;
  };
  const preview=()=>{
    if(!/^\d{4}-\d{2}$/.test(f.from))return 'Choisis le mois.';
    if(f.from>lastM)return `Ce mois est après la dernière mensualité des projets (${mShort(lastM)}).`;
    const groups=new Map();
    people.forEach(p=>{const s=schedule(p),k=JSON.stringify(s.map(z=>[z.from,z.to,z.ski,z.credit,z.parts]));if(!groups.has(k))groups.set(k,{s,names:[]});groups.get(k).names.push(p.name)});
    let h='';
    for(const {s,names} of groups.values()){
      h+=`<div class="who">${esc(names.join(', '))}</div>`;
      h+=s.map(z=>`<div class="ln"><span>${mShort(z.from)}${z.to!==z.from?' → '+mShort(z.to):''}</span><b>${eur(z.ski+z.credit)}</b></div><div class="det">${z.parts.map(q=>eur(q[1])+' '+esc(q[0])).concat(z.credit>0?[eur(z.credit)+' crédit']:[]).join(' + ')||'aucun projet ce mois-là'}${z.over>0?` <span class="neg">· il manque ${eur(z.over)}</span>`:''}</div>`).join('');
    }
    const warn=[];
    const overP=people.filter(p=>schedule(p).some(z=>z.over>0));
    if(overP.length)warn.push(`<span class="neg">Certains mois, les voyages à prix fixé demandent plus que la cotisation (${esc(overP.map(p=>p.name).join(', '))}) : la cotisation reste au même montant, mais ces voyages recevront moins que prévu.</span>`);
    /* quelqu'un qui ne cotiserait plus (ou seulement le crédit) quelques mois : aucun de ses voyages ne couvre ces mois */
    for(const p of people){
      const holes=[];for(const z of schedule(p)){if(z.parts.length)continue;const l=holes[holes.length-1];if(l&&addMonth(l.to)===z.from)l.to=z.to;else holes.push({from:z.from,to:z.to})}
      if(holes.length)warn.push(`<span class="neg">${esc(p.name)} : rien pour les voyages ${holes.map(z=>z.from===z.to?'en '+mShort(z.from):`de ${mShort(z.from)} à ${mShort(z.to)}`).join(', ')}.</span> Aucun de ses voyages ne couvre ces mois : avance le début des cotisations d’un de ses voyages.`);
    }
    const inNoF=noF.filter(x=>x.win.some(m=>m>=f.from&&m<=lastM)).map(x=>esc(x.pr.name));
    if(inNoF.length)warn.push(`<span class="neg">${inNoF.join(', ')} n’a pas encore de financement : ses mois ne sont pas comptés.</span>`);
    if(people.some(p=>sortRates(p).some(r=>r.from>=f.from)))warn.push('Les changements déjà prévus à partir de ce mois sont remplacés.');
    warn.push(`Après ${mShort(lastM)}, la cotisation reste au dernier montant : pense à la changer ou à préparer le prochain voyage.`);
    return `<div class="sched">${h}</div><p class="note">${warn.join('<br>')}</p>`;
  };
  openSheet({
    render(){return `<h3>Mettre à jour les cotisations</h3><p class="lead">${restP.length?`Pour les voyages « le reste », la cotisation reste à ${eur(Math.max(...restP.map(x=>x.total||0)))} en tout : le crédit, puis les voyages à prix fixé, puis le reste.`:'Chacun paie la somme des mensualités des voyages auxquels il participe, plus la part crédit jusqu’à la fin du crédit (sauf si elle est déjà comprise dans la mensualité).'}</p>
      <div class="field"><label for="aa-f">À partir de</label><input id="aa-f" type="month" value="${esc(f.from)}"></div>
      <div id="aa-res">${preview()}</div>
      <div class="actions"><button class="btn block" data-act="aa-save">Appliquer à ${people.length} personne${people.length>1?'s':''}</button></div>`},
    bind(root){const fr=root.querySelector('#aa-f'),out=root.querySelector('#aa-res');const upd=()=>{f.from=fr.value;out.innerHTML=preview()};fr.addEventListener('input',upd);fr.addEventListener('change',upd)},
    act:{'aa-save':async b=>{
      if(!/^\d{4}-\d{2}$/.test(f.from)||f.from>lastM){toast('Choisis un mois avant '+mShort(lastM));return}
      b.disabled=true;
      const ok=await w(async()=>{
        for(const p of people){
          const rates=sortRates(p).filter(r=>r.from<f.from).map(r=>Object.assign({},r));let prev=null;
          for(const z of schedule(p)){
            const r={from:z.from,monthly:r2(z.ski+z.credit),ski:r2(z.ski),credit:r2(z.credit)};
            if(prev&&prev.monthly===r.monthly&&prev.ski===r.ski&&prev.credit===r.credit)continue;
            rates.push(r);prev=r;
          }
          await S.db.doc('people/'+p.id).update({rates});
        }
      },'Cotisations mises à jour');
      if(ok)closeSheet();else b.disabled=false;
    }}});
}

/* ---------- transferts entre projets ---------- */
function sheetAlloc(o={}){
  const c=calc();
  const bal=v=>v==='none'?c.unalloc:(c.proj[v]?c.proj[v].balance:0);
  const opts=[['none','Non affecté']].concat(c.order.map(id=>[id,c.proj[id].pr.name]));
  const f={from:o.from||null,to:o.to||null,amount:'',date:todayStr(),note:''};
  if(!f.from){const cands=['none'].concat(c.order).filter(v=>v!==f.to&&bal(v)>0.005).sort((a,b)=>bal(b)-bal(a));f.from=cands[0]||'none'}
  if(!f.to){const l=c.order.filter(id=>id!==f.from&&!c.proj[id].passed);f.to=l[0]||(f.from==='none'?(c.order[0]||'none'):'none')}
  const setAmt=()=>{const b=bal(f.from);f.amount=b>0.005?fmtN(b):''};setAmt();
  const sel=(id,cur)=>`<select id="${id}">${opts.map(([v,l])=>`<option value="${esc(v)}" ${cur===v?'selected':''}>${esc(l)} · ${eur(bal(v))}</option>`).join('')}</select>`;
  openSheet({
    render(){return `<h3>Transférer de l’argent</h3><p class="lead">Déplace de l’argent d’un projet à l’autre, par exemple le reste d’un voyage terminé. Le solde du livret ne change pas.</p>
      <div class="field"><label for="al-f">Depuis</label>${sel('al-f',f.from)}</div>
      <div class="field"><label for="al-t">Vers</label>${sel('al-t',f.to)}</div>

        <div class="field"><label for="al-a">Montant (€)</label><input id="al-a" inputmode="decimal" value="${esc(f.amount)}"></div>
        <div class="field"><label for="al-d">Le</label><input id="al-d" type="date" value="${esc(f.date)}"></div>
      </div>
      <div class="field"><label for="al-n">Note (facultatif)</label><input id="al-n" value="${esc(f.note)}" placeholder="ex. reste du ski"></div>
      <div class="actions"><button class="btn block" data-act="al-save">Transférer</button></div>`},
    bind(root){
      bindInputs(root,{'al-t':'to','al-a':'amount','al-d':'date','al-n':'note'},f);
      root.querySelector('#al-f').addEventListener('change',e=>{f.from=e.target.value;setAmt();drawSheet()});
    },
    act:{'al-save':async b=>{
      const a=num(f.amount);
      if(f.from===f.to){toast('Choisis deux projets différents');return}
      if(!(a>0)){toast('Indique un montant');return}
      b.disabled=true;
      const ok=await w(()=>S.db.doc('allocs/'+newId('a')).set({from:f.from==='none'?null:f.from,to:f.to==='none'?null:f.to,amount:r2(a),date:f.date||todayStr(),note:f.note.trim(),recordedAt:new Date().toISOString()}));
      if(ok){closeSheet();toast(`${eur(a)} transférés vers ${projName(f.to==='none'?null:f.to)}`)}else b.disabled=false;
    }}});
}

/* Calcul avec un projet en brouillon (aperçu avant d'enregistrer). */
function simCalc(id,draft){const sp=S.projects;S.projects=Object.assign({},sp,{[id]:Object.assign({order:999},sp[id]||{},draft,{id})});try{return calc()}finally{S.projects=sp}}
/* Cotisation la plus courante (ex. 150 €) parmi des cotisants, pour un mois. */
function usualMonthly(ids,m){const cnt={};ids.forEach(id=>{const p=S.people[id];if(p){const v=rateFor(p,m).monthly;if(v>0)cnt[v]=(cnt[v]||0)+1}});const k=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];return k?+k:150}
/* Ce qui va chaque mois à un projet « le reste », regroupé par personnes qui ont le même calendrier. */
function flowHtml(x){
  const groups=new Map();
  for(const [pid,arr] of Object.entries(x.flow||{})){
    const segs=[];for(const [m,v] of arr){const l=segs[segs.length-1];if(l&&Math.abs(l.v-v)<0.005&&addMonth(l.to)===m)l.to=m;else segs.push({from:m,to:m,v})}
    const k=JSON.stringify(segs);if(!groups.has(k))groups.set(k,{segs,names:[]});groups.get(k).names.push(S.people[pid]?S.people[pid].name:pid);
  }
  let h='';for(const {segs,names} of groups.values())h+=`<div class="who">${esc(names.join(', '))}</div>`+segs.map(z=>`<div class="ln"><span>${mShort(z.from)}${z.to!==z.from?' → '+mShort(z.to):''}</span><b>${eur(z.v)}</b></div>`).join('');
  return h?`<div class="sched">${h}</div>`:'';
}
const namesOf=ids=>ids.map(i=>S.people[i]?S.people[i].name:'').filter(Boolean).join(', ');
/* ---------- plan 150 € : l'appli règle tout d'un coup ----------
   Jusqu'en déc. 2026 : la cotisation va au Ski 2026 (et au crédit), comme aujourd'hui.
   Dès janv. 2027 : 150 € par personne. Le crédit d'abord (jusqu'à sa fin), puis ce qu'il faut pour le Ski 2027,
   et le reste pour le Voyage 2028. Les projets de test sans argent noté sont supprimés. */
const PLAN_TOTAL=150,PLAN_FROM='2027-01';
/* Quand on recopie une dépense d'un voyage passé, on garde un calcul (« 170 € × 2 ») mais pas une note de paiement. */
const copyNote=n=>n&&/[x×]\s*\d/i.test(n)?n:'';
/* Nettoyage (une fois) : les notes de paiement recopiées par erreur dans les dépenses d'un nouveau voyage. */
let notesCleaned=false;
async function cleanCopiedNotes(){
  if(notesCleaned||!W()||!allReady()||!S.settings||S.settings.notesClean1)return;notesCleaned=true;
  const all=Object.values(S.expenses),fix=[];
  for(const e of all){
    if(!e.note||(e.payments||[]).length||copyNote(e.note))continue;
    if(all.some(o=>o!==e&&expProject(o)!==expProject(e)&&o.label===e.label&&o.note===e.note&&(o.payments||[]).length))fix.push(e.id);
  }

}
const plannedTotal=pid=>r2(Object.values(S.expenses).filter(e=>expProject(e)===pid).reduce((s,e)=>s+expCost(e),0));
function projHasMoney(pid){
  const pr=S.projects[pid]||{};
  return Object.values(S.expenses).some(e=>expProject(e)===pid&&(e.payments||[]).length)||(pr.settles||[]).length>0
    ||Object.values(S.extras).some(x=>x.project===pid)||Object.values(S.moves).some(x=>x.project===pid)||Object.values(S.allocs).some(a=>a.from===pid||a.to===pid);

function planBuild(){
  const st=S.settings,prs=sortedProjects(),c0=calc();
  const isSki=p=>/ski/i.test(p.name||''),mo=p=>String(p.month||'');
  const priceOf=p=>p.mode==='goal'&&+p.goal>0?+p.goal:p.mode==='expenses'?plannedTotal(p.id):0;
  const ski26=prs.find(p=>isSki(p)&&mo(p)&&mo(p)<PLAN_FROM)||null;
  const v28=prs.find(p=>p.id==='voyage2028')||prs.find(p=>!isSki(p)&&mo(p).slice(0,4)==='2028')||null;
  const cands=prs.filter(p=>p!==ski26&&p!==v28&&isSki(p)&&mo(p)>=PLAN_FROM&&mo(p)<'2028-01')
    .sort((a,b)=>(priceOf(b)>0?1:0)-(priceOf(a)>0?1:0)||mo(a).localeCompare(mo(b))||byOrder(a,b));
  const ski27=cands[0]||null;
  const others=prs.filter(p=>p!==ski26&&p!==v28&&p!==ski27);
  const del=others.filter(p=>!projHasMoney(p.id)),keep=others.filter(p=>projHasMoney(p.id));
  const active=sortedPeople().filter(p=>p.active!==false);
  const skiMem=ski27&&Array.isArray(ski27.members)&&ski27.members.length?ski27.members.filter(i=>S.people[i])
    :(ski26&&c0.proj[ski26.id]&&c0.proj[ski26.id].members.length?c0.proj[ski26.id].members:active.map(p=>p.id));
  const hasPrice=!!(ski27&&priceOf(ski27)>0);
  const newLines=hasPrice||!ski26?[]:sortedExpenses().filter(e=>expProject(e)===ski26.id)
    .map(e=>e.rest?{label:e.label,rest:true}:{label:e.label,planned:r2(expCost(e)),note:copyNote(e.note)}).filter(l=>l.rest||l.planned>0);
  const nextOrder=Math.max(0,...prs.map(p=>+p.order||0))+1;
  const ski26Data=ski26&&!ski26.firstMonth?{firstMonth:(c0.proj[ski26.id]&&c0.proj[ski26.id].win[0])||st.startMonth,endRule:'trip'}:null;
  const skiMonth=ski27?mo(ski27):(ski26?addMonth(mo(ski26),12):'2027-12');
  const ski27Data=Object.assign(ski27?{}:{name:'Ski 2027',month:skiMonth,startDate:null,endDate:null,note:'',order:nextOrder},
    {firstMonth:PLAN_FROM,endRule:'trip',members:skiMem,mode:hasPrice?ski27.mode:'expenses'});
  const v28Data=Object.assign(v28?{}:{name:'Voyage 2028',startDate:null,endDate:null,note:'',order:nextOrder+1},
    {month:v28&&mo(v28)?mo(v28):'2028-04',mode:'rest',total:PLAN_TOTAL,firstMonth:PLAN_FROM,endRule:'trip',members:active.map(p=>p.id)});
  const ce=st.creditEndMonth;
  const ratesFor=p=>{
    const out=sortRates(p).filter(r=>r.from<PLAN_FROM).map(r=>Object.assign({},r));
    const cr=Math.min(rateFor(p,addMonth(PLAN_FROM,-1)).credit||50,PLAN_TOTAL);
    if(ce&&ce>=PLAN_FROM){out.push({from:PLAN_FROM,monthly:PLAN_TOTAL,ski:PLAN_TOTAL-cr,credit:cr});out.push({from:addMonth(ce),monthly:PLAN_TOTAL,ski:PLAN_TOTAL,credit:0})}
    else out.push({from:PLAN_FROM,monthly:PLAN_TOTAL,ski:PLAN_TOTAL,credit:0});
    return out;
  };
  return {ski26,ski27,v28,del,keep,active,skiMem,hasPrice,newLines,ski26Data,ski27Data,v28Data,ratesFor,skiPriceNow:ski27?priceOf(ski27):0};
}
/* Aperçu : on calcule comme si le plan était appliqué, sans rien enregistrer. */
function planSim(pl){
  const P=JSON.parse(JSON.stringify(S.projects)),E=JSON.parse(JSON.stringify(S.expenses)),PE=JSON.parse(JSON.stringify(S.people));
  const delIds=new Set(pl.del.map(p=>p.id));
  Object.keys(E).forEach(k=>{if(delIds.has(expProject(E[k])))delete E[k]});
  delIds.forEach(id=>delete P[id]);
  if(pl.ski26&&pl.ski26Data)Object.assign(P[pl.ski26.id],pl.ski26Data);
  const sid=pl.ski27?pl.ski27.id:'__ski27',vid=pl.v28?pl.v28.id:'__v28';
  P[sid]=Object.assign({id:sid},P[sid]||{},pl.ski27Data);
  P[vid]=Object.assign({id:vid},P[vid]||{},pl.v28Data);
  pl.newLines.forEach((l,i)=>{E['__l'+i]={id:'__l'+i,project:sid,label:l.label,planned:l.rest?null:l.planned,rest:!!l.rest,closed:false,note:l.note||'',order:900+i,payments:[]}});
  pl.active.forEach(p=>{PE[p.id].rates=pl.ratesFor(p)});
  const save=[S.projects,S.expenses,S.people];S.projects=P;S.expenses=E;S.people=PE;
  try{const c=calc();return {c,ski:c.proj[sid],voy:c.proj[vid],ski26:pl.ski26?c.proj[pl.ski26.id]:null}}finally{S.projects=save[0];S.expenses=save[1];S.people=save[2]}
}

/* Liste lisible des changements : prix, part par personne, budget, pour chaque projet touché. */
function effectsHtml(c0,c1){
  const out=[];
  for(const id of c1.order){
    const a=c0.proj[id],b=c1.proj[id];if(!b||b.passed)continue;const n=esc(b.pr.name);
    if(!a){out.push(`<b>${n}</b> : nouveau projet`);continue}
    const ch=[];
    if(b.mode==='expenses'||b.mode==='goal'){if(Math.abs((a.goal||0)-(b.goal||0))>0.005)ch.push(`prix ${eur(a.goal||0)} → ${eur(b.goal||0)}`);if((a.target||0)!==(b.target||0))ch.push(`${eur(a.target||0)} → <b>${eur(b.target||0)}</b> par personne et par mois`)}
    if(b.budget!=null&&Math.abs((a.budget||0)-b.budget)>0.5)ch.push(`budget ${eur(a.budget||0)} → <b>${eur(b.budget)}</b>`);
    if(a.members.length!==b.members.length)ch.push(`${a.members.length} → ${b.members.length} cotisants`);
    if(a.ledger.guests.length!==b.ledger.guests.length)ch.push(`${a.ledger.guests.length} → ${b.ledger.guests.length} invités`);
    if(!ch.length&&Math.abs(a.available-b.available)>0.5)ch.push(`reste ${eur(a.available)} → ${eur(b.available)}`);
    if(ch.length)out.push(`<b>${n}</b> : ${ch.join(' · ')}`);
  }
  return out.length?`<div class="effects"><span>Ce qui change</span><ul>${out.map(t=>`<li>${t}</li>`).join('')}</ul></div>`:`<div class="effects"><span>Rien ne change dans les calculs.</span></div>`;
}

function sheetExpBulk(pid){

  const f={lines:exps.map(e=>({id:e.id,label:e.label||'',amount:e.rest?'':calcAmt(e),rest:!!e.rest,closed:!!e.closed,paid:r2(sumPay(e)),locked:(e.payments||[]).length>0,del:false,orig:e}))};
  const live=()=>f.lines.filter(l=>!l.del);
  const costOf=l=>l.rest||l.closed?l.paid:Math.max(num(l.amount)||0,l.paid);
  const plan=()=>{/* les lignes telles qu'elles seront enregistrées */
    const out=[];
    for(const l of f.lines){
      if(l.del){if(l.id)out.push({del:true,id:l.id});continue}
      const label=l.label.trim(),raw=String(l.amount).trim();
      if(!l.id&&!label&&!raw)continue;

      out.push({id:l.id,label:label||'Autre dépense',planned,raw,rest:l.rest,closed:l.closed,orig:l.orig});
    }

    let i=0;for(const o of p.ops){

    }

  openSheet({
    render(){return `<h3>Dépenses · ${esc(pr.name)}</h3><p class="lead">Change les noms et les montants, ajoute ou retire des lignes. L’appli recalcule tout quand tu enregistres.</p>
      <div id="eb-lines" data-calc-host>${f.lines.map((l,i)=>l.del?'':`<div class="line"><input id="eb-l${i}" data-i="${i}" data-k="label" value="${esc(l.label)}" placeholder="Dépense" aria-label="Dépense"><input id="eb-a${i}" data-i="${i}" data-k="amount" inputmode="decimal" ${l.rest||l.closed?'disabled':'data-calc'} value="${esc(l.amount)}" placeholder="${l.rest?'reste':l.closed?'soldé':'€'}" aria-label="Montant de ${esc(l.label||'la dépense')}"><button type="button" class="x" data-act="eb-rm" data-i="${i}" ${l.locked?'disabled title="Déjà payée : retire d’abord ses paiements"':''} aria-label="Retirer">×</button></div>${l.rest||l.closed||l.paid>0?`<p class="linenote">${l.rest?'prend le reste du pot':l.closed?'soldée':'déjà payé'} ${l.paid>0?'· '+eur(l.paid)+' payés':''}</p>`:''}`).join('')}</div>
      <div class="pick sug" style="margin:6px 0 10px">${SUGGEST.filter(s=>!live().some(l=>l.label.toLowerCase()===s.toLowerCase())).map(s=>`<button type="button" data-act="eb-add" data-v="${esc(s)}">+ ${esc(s)}</button>`).join('')}<button type="button" data-act="eb-add" data-v="">+ Autre</button></div>
      <div class="goalres" id="eb-res">${res()}</div>
      <div class="actions"><button class="btn block" data-act="eb-save">Enregistrer</button></div>`},
    bind(root){
      root.querySelectorAll('#eb-lines input').forEach(el=>el.addEventListener('input',()=>{f.lines[+el.dataset.i][el.dataset.k]=el.value;const o=root.querySelector('#eb-res');if(o)o.innerHTML=res()}));
    },
    act:{
      'eb-add':b=>{const lb=b.dataset.v||'';f.lines.push({id:null,label:lb,amount:'',rest:false,closed:false,paid:0,locked:false,del:false,orig:null});drawSheet();const i=f.lines.length-1;setTimeout(()=>{const el=sheetBody.querySelector('#eb-'+(lb?'a':'l')+i);if(el)el.focus()},0)},

          }

      }
    }});
}

  const crOpen=()=>!!(ce&&isMonth(f.from)&&f.from<=ce&&+S.settings.creditMonthly>0);

    if(f.kind==='guest')return {guest:{id:newId('g'),name}};
    const m=num(f.monthly);if(!(m>0))return {err:'Indique ce que '+name+' met par mois'};
    if(!isMonth(f.from))return {err:'Choisis le mois de départ'};
    const cr=f.credit&&crOpen()?Math.min(crAmt(),m):0;
    return {person:{id:slug(name),name,fromMonth:f.from,untilMonth:null,monthly:r2(m),ski:r2(m-cr),credit:r2(cr),active:true,order:Math.max(0,...Object.values(S.people).map(p=>+p.order||0))+1}};
  };
  const memList=d=>sortedPeople().map(p=>p.id).filter(i=>f.mem.has(i)).concat(d&&d.person?[d.person.id]:[]);
  const sim=d=>simWith(D=>{
    if(d.person)D.people[d.person.id]=Object.assign({},d.person);
    const P=D.projects[pid];P.members=memList(d);
    if(!P.firstMonth&&x0.win.length){P.firstMonth=x0.win[0];P.endRule='trip'}
    if(d.guest)P.guests=projGuests(P).concat([d.guest]);
  });
  const res=()=>{const d=draft();if(d.err)return `<span class="neg">${esc(d.err)}</span>`;if(!memList(d).length&&!projGuests(pr).length&&!d.guest)return 'Choisis au moins un participant.';return effectsHtml(c0,sim(d))};
  openSheet({
    render(){
      const d=draft();
      return `<h3>Participants · ${esc(pr.name)}</h3><p class="lead">Coche qui participe, ou ajoute quelqu’un de nouveau. L’appli recalcule tout.</p>
      <span class="flabel">Cotisants de la cagnotte</span>
      <div class="pick" style="margin:4px 0 14px">${people.map(p=>`<button type="button" data-act="mb-m" data-id="${esc(p.id)}" aria-pressed="${f.mem.has(p.id)}">${esc(p.name)}</button>`).join('')}</div>
      <h4>Quelqu’un de nouveau</h4>
      <div class="field"><label for="mb-n">Prénom</label><input id="mb-n" value="${esc(f.name)}" placeholder="ex. Manon" autocomplete="off"></div>
      ${seg('mb-kind',f.kind,[['cot','Cotise chaque mois'],['guest','Juste ce voyage']])}
      ${f.kind==='cot'?`<div class="fields2">
        <div class="field"><label for="mb-f">Cotise à partir de</label><input id="mb-f" type="month" value="${esc(f.from)}"></div>
        <div class="field"><label for="mb-a">Par mois (€)</label><input id="mb-a" inputmode="decimal" value="${esc(f.monthly)}"></div>
      </div>
      ${crOpen()?`<div class="checks"><label class="check"><input id="mb-cr" data-act="mb-cr" type="checkbox" ${f.credit?'checked':''}> Paie aussi le crédit (${eur(crAmt())} par mois jusqu’en ${mYear(ce).toLowerCase()})</label></div>
      <p class="note" style="margin:-6px 0 12px">${f.credit?`${eur(crAmt())} de sa cotisation iront au crédit jusqu’en ${mYear(ce).toLowerCase()}.`:'Toute sa cotisation ira aux voyages : le crédit vient d’un ancien voyage.'}</p>`:''}
      <p class="note" style="margin:0 0 12px">Il est ajouté aux cotisants (tableau des versements) et à ce voyage.</p>`
      :`<p class="note" style="margin:-4px 0 12px">Il ne cotise pas chaque mois : il paie sa part des dépenses de ce voyage (carte « Participants et comptes »).</p>`}
      <div class="goalres" id="mb-res">${res()}</div>
      <div class="actions"><button class="btn block" data-act="mb-save">Enregistrer</button></div>`},
    bind(root){
      const upd=()=>{const o=root.querySelector('#mb-res');if(o)o.innerHTML=res()};
      const on=(id,k,redraw)=>{const el=root.querySelector('#'+id);if(el){el.addEventListener('input',()=>{f[k]=el.value;upd()});if(redraw)el.addEventListener('change',()=>{f[k]=el.value;drawSheet()})}};
      on('mb-n','name');on('mb-a','monthly');on('mb-f','from',true);
    },
    act:{
      'mb-m':b=>{const id=b.dataset.id;if(f.mem.has(id))f.mem.delete(id);else f.mem.add(id);drawSheet()},
      'mb-kind':b=>{f.kind=b.dataset.v;drawSheet()},
      'mb-cr':()=>{f.credit=!f.credit;drawSheet()},
      'mb-save':async b=>{
        const d=draft();if(d.err){toast(d.err);return}
        const mem=memList(d);if(!mem.length&&!projGuests(pr).length&&!d.guest){toast('Choisis au moins un participant');return}
        b.disabled=true;
        const ok=await w(async()=>{
          if(d.person){const p=Object.assign({},d.person);delete p.id;await S.db.doc('people/'+d.person.id).set(p)}
          const upd={members:mem};
          if(!pr.firstMonth&&x0.win.length){upd.firstMonth=x0.win[0];upd.endRule='trip'}
          if(d.guest)upd.guests=projGuests(S.projects[pid]).concat([d.guest]);
          await freezeLegacy(pid);
          await S.db.doc('projects/'+pid).update(upd);
        },d.person?d.person.name+' ajouté':d.guest?d.guest.name+' ajouté comme invité':'Participants enregistrés');
        if(ok)closeSheet();else b.disabled=false;
      }
    }});
}

function guestUsed(pid,gid){
  const pr=S.projects[pid];
  return Object.values(S.expenses).some(e=>expProject(e)===pid&&((e.payments||[]).some(q=>q.by===gid)))||(pr.settles||[]).some(s=>s.from===gid||s.to===gid);
}
function sheetGuestDel(pid,gid){
  const pr=S.projects[pid];if(!pr)return;const g=projGuests(pr).find(x=>x.id===gid);if(!g)return;
  const used=guestUsed(pid,gid);
  openSheet({
    render(){return `<h3>Retirer ${esc(g.name)} ?</h3>
      ${used?`<p class="lead">${esc(g.name)} a déjà payé quelque chose ou reçu un remboursement sur ce voyage. Retire d’abord ces lignes pour garder des comptes justes.</p><div class="actions"><button class="btn ghost block" data-act="gd-close">Fermer</button></div>`
      :`<p class="lead">${esc(g.name)} ne sera plus compté dans les dépenses de ${esc(pr.name)}.</p><div class="actions"><button class="btn danger block" data-act="gd-ok">Retirer</button></div>`}`},
    act:{
      'gd-close':()=>closeSheet(),
      'gd-ok':async b=>{
        b.disabled=true;
        const ok=await w(async()=>{
          await S.db.doc('projects/'+pid).update({guests:projGuests(S.projects[pid]).filter(x=>x.id!==gid)});
          for(const e of Object.values(S.expenses))if(expProject(e)===pid&&Array.isArray(e.split)&&e.split.includes(gid))await S.db.doc('expenses/'+e.id).update({split:e.split.filter(i=>i!==gid)});
        },g.name+' retiré');

}
function sheetSettle(pid,pre){

/* Choix des participants concernés par une dépense (seulement quand le voyage a des invités). */
function splitPicker(act,x,sel){
  if(!x||!x.ledger.guests.length)return '';
  const all=!sel||!sel.length,set=new Set(all?x.ledger.parts:sel);
  return `<span class="flabel">Pour qui ?</span><div class="pick" style="margin:4px 0 4px">${x.ledger.parts.map(p=>`<button type="button" data-act="${act}" data-id="${esc(p)}" aria-pressed="${set.has(p)}">${esc(partName(x.pr,p))}</button>`).join('')}</div>
    <p class="note" style="margin:0 0 12px">${all?'Tout le monde.':`${set.size} personne${set.size>1?'s':''} sur ${x.ledger.parts.length}.`} Touche un nom pour le retirer ou le remettre.</p>`;
}
function toggleSplit(cur,x,id){
  const parts=x.ledger.parts;let s=new Set(cur&&cur.length?cur:parts);
  if(s.has(id)){if(s.size<=1){toast('Il faut au moins une personne');return cur}s.delete(id)}else s.add(id);
  return s.size===parts.length?null:parts.filter(p=>s.has(p));
}
function payerSelect(id,x,v){
  if(!x)return '';
  const opts=[['','La cagnotte']].concat(x.ledger.parts.map(p=>[p,partName(x.pr,p)+' (de sa poche)']));
  return `<div class="field"><label for="${id}">Payé par</label><select id="${id}">${opts.map(([k,l])=>`<option value="${esc(k)}" ${(v||'')===k?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`;
}

function sheetExpDetail(eid){

      return `<h3>${esc(e.label)}</h3>
      <p class="lead">${esc(pr?pr.name:'')}${e.closed?' · <span class="chip ok">Soldé</span>':''}${e.note?' · '+esc(e.note):''}</p>
      <div class="kpis"><div><span>Prévu</span><b>${plannedTxt}</b></div><div><span>Payé</span><b>${eur(paid)}</b></div><div><span>Reste</span><b>${remTxt}</b></div></div>
      ${forTxt}
      ${main}
      <h4>${pays.some(x=>x.by)?'Paiements':'Sorties du livret'}</h4>
      ${pays.length?`<div class="rows">${pays.map(x=>`<div class="row"><div class="l">${fmtDate(x.date)}${x.by?` · <b>avancé par ${esc(partName(pr,x.by))}</b>`:''}${x.note?` · <span class="muted">${esc(x.note)}</span>`:''}</div><div class="r" style="flex-direction:row;align-items:center;gap:8px">${eur(x.amount)}${W()?`<button class="x" data-act="ed-rmp" data-id="${esc(x.id)}" aria-label="Retirer ce paiement">×</button>`:''}</div></div>`).join('')}</div>`:`<p class="note">Rien de payé pour l’instant.</p>`}
      ${edit}

    },
    bind(root){if(d)bindInputs(root,{'ed-l':'label','ed-p':'planned'},d)},
    act:{
      'ed-pay':()=>sheetExpPay(eid,{}),
      'ed-close':()=>{const e=S.expenses[eid];if(!e)return;const rem=e.planned==null?0:Math.max(+e.planned-sumPay(e),0);if(rem>0)sheetExpPay(eid,{close:true});else w(()=>S.db.doc('expenses/'+eid).update({closed:true}),'Dépense soldée')},
      'ed-reopen':()=>w(()=>S.db.doc('expenses/'+eid).update({closed:false}),'Dépense rouverte'),

function longDate(s){const [y,m,d]=s.split('-').map(Number);return `${d} ${MOIS[m-1]} ${y}`}
const plainRest=x=>x.rest.map(e=>String(e.label).toLowerCase()).join(', ');
/* Factures du voyage en cours : déjà payées (tout ce qui est sorti du livret) et qui restent. */
function billsFor(x){
  const paid=[],left=[];
  for(const e of x.exps){
    const pd=sumPay(e);
    if(pd>0)paid.push([e.label,pd]);
    if(e.rest||e.closed)continue;
    if(e.planned==null)left.push([e.label,null]);
    else{const r=Math.max(+e.planned-pd,0);if(r>0)left.push([e.label,r])}
  }
  return {paid,left};
}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

      </div>
      <div class="fields3">
        <div class="field"><label for="pn-m">Par mois</label><input id="pn-m" inputmode="decimal" value="${esc(f.monthly)}"></div>
        <div class="field"><label for="pn-s">Part voyages</label><input id="pn-s" inputmode="decimal" value="${esc(f.ski)}"></div>
        <div class="field"><label for="pn-c">Part crédit</label><input id="pn-c" inputmode="decimal" value="${esc(f.credit)}"></div>
      </div>
      <div class="actions"><button class="btn block" data-act="pn-save">Ajouter</button></div>`},
    bind(root){bindInputs(root,{'pn-n':'name','pn-f':'from','pn-m':'monthly','pn-s':'ski','pn-c':'credit'},f)},
    act:{'pn-save':async()=>{
      const name=f.name.trim();if(!name){toast('Donne un nom');return}
      const monthly=num(f.monthly),ski=num(f.ski),credit=num(f.credit);
      if(monthly==null||ski==null||credit==null||monthly<0||ski<0||credit<0){toast('Montants invalides');return}
      const order=Math.max(0,...Object.values(S.people).map(x=>+x.order||0))+1;
      const ok=await w(()=>S.db.doc('people/'+slug(name)).set({name,monthly:r2(monthly),ski:r2(ski),credit:r2(credit),active:true,fromMonth:f.from||cm,order}));
      if(ok){closeSheet();toast(name+' ajouté')}
    }}});
}

/* ---------- view events ---------- */
view.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='pay'){const o=calc().owe[b.dataset.p];sheetPay({pid:b.dataset.p,months:o?[...o.late,...o.due]:undefined})}
  else if(a==='pay-new')sheetPay();
  else if(a==='cell')sheetCell(b.dataset.p,b.dataset.m);
  else if(a==='extra-new'){if(W())sheetExtra()}
  else if(a==='extra-del'){const id=b.dataset.id;if(S.delArm!==id){S.delArm=id;render();return}S.delArm=null;w(()=>S.db.doc('extras/'+id).delete(),'Virement retiré')}
  else if(a==='force-update')forceUpdate(b);
  else if(a==='backup')exportBackup();
  else if(a==='import')pickImport();
  else if(a==='share-state')sheetNotify(null);
  else if(a==='plan-apply'){if(W())planApply(b)}
  else if(a==='plan-later'){S.planLater=true;render()}
  else if(a==='plan-open'){if(W())sheetPlan()}
  else if(a==='rate-new'){if(W())sheetRate(b.dataset.pid)}
  else if(a==='rate-del'){
    const pid=b.dataset.pid,from=b.dataset.from,key=pid+'@'+from;
    if(S.delArm!==key){S.delArm=key;render();return}
    S.delArm=null;const p=S.people[pid];if(!p)return;
    const rates=sortRates(p).filter(r=>r.from!==from).map(r=>Object.assign({},r));
    w(()=>S.db.doc('people/'+pid).update({rates}),'Changement retiré');
  }
  else if(a==='move-new'){if(W())sheetMove()}
  else if(a==='move-del'){const id=b.dataset.id;if(S.delArm!==id){S.delArm=id;render();return}S.delArm=null;w(()=>S.db.doc('moves/'+id).delete(),'Mouvement retiré')}
  else if(a==='relance'){const o=calc().owe[b.dataset.p];if(o)sheetRelance(relanceText(o),'Relancer '+o.p.name)}
  else if(a==='relance-all')sheetRelance(groupText(calc()),'Message pour le groupe');
  else if(a==='credit-transfer'){if(W())sheetCreditTransfer()}
  else if(a==='goal-edit'){if(W())sheetGoal(b.dataset.id)}
  else if(a==='goal-apply'){if(W())sheetApplyAll()}
  else if(a==='alloc-new'){if(W())sheetAlloc({from:b.dataset.from,to:b.dataset.to})}
  else if(a==='alloc-del'){const id=b.dataset.id;if(S.delArm!==id){S.delArm=id;render();return}S.delArm=null;w(()=>S.db.doc('allocs/'+id).delete(),'Transfert retiré')}
  else if(a==='show-all'){S.showAll=!S.showAll;render()}
  else if(a==='go-proj'){S.sel=b.dataset.id}
  else if(a==='proj-sel'){S.sel=b.dataset.id;render()}
  else if(a==='guest-new'){if(W())sheetGuest(b.dataset.pid)}
  else if(a==='members'){if(W())sheetMembers(b.dataset.pid)}
  else if(a==='exp-bulk'){if(W())sheetExpBulk(b.dataset.id)}
  else if(a==='guest-del'){if(W())sheetGuestDel(b.dataset.pid,b.dataset.id)}
  else if(a==='settle-new'){if(W())sheetSettle(b.dataset.pid,{})}
  else if(a==='settle-done'){if(!W())return;const x=calc().proj[b.dataset.pid];const s=x&&settleSuggestions(x)[+b.dataset.i];if(s)sheetSettle(b.dataset.pid,s)}
  else if(a==='settle-del'){const id=b.dataset.id,pid=b.dataset.pid;if(S.delArm!==id){S.delArm=id;render();return}S.delArm=null;w(()=>S.db.doc('projects/'+pid).update({settles:(S.projects[pid].settles||[]).filter(s=>s.id!==id)}),'Remboursement retiré')}
  else if(a==='proj-new'){if(W())sheetWizard()}
  else if(a==='proj-edit'){if(W())sheetProject(b.dataset.id)}
  else if(a==='exp')sheetExpDetail(b.dataset.e);
  else if(a==='exp-pay')sheetExpPay(b.dataset.e,{});
  else if(a==='exp-new'){if(W())sheetExpNew(b.dataset.id)}
  else if(a==='recal')sheetRecal();
  else if(a==='person-new')sheetPerson();
  else if(a==='init'){const cm=todayStr().slice(0,7);w(()=>S.db.doc('settings/main').set({anchorBalance:0,anchorAt:new Date().toISOString(),creditMonthly:0,creditDay:1,creditEndMonth:null,startMonth:cm,endMonth:cm}),'Cagnotte créée')}
});
function parseField(t){
  const k=t.dataset.kind,v=t.value;
  if(k==='bool')return t.checked;
  if(k==='text'){const s=v.trim();return s||undefined}
  if(k==='num'){const n=num(v);return n==null||n<0?undefined:r2(n)}
  if(k==='int'){const n=parseInt(v,10);return n>=1&&n<=28?n:undefined}
  if(k==='month')return /^\d{4}-\d{2}$/.test(v)?v:undefined;
  if(k==='month-opt')return v===''?null:(/^\d{4}-\d{2}$/.test(v)?v:undefined);
  return undefined;
}
view.addEventListener('change',async e=>{
  const t=e.target;if(!t.dataset||!t.dataset.kind)return;
  const v=parseField(t);
  if(v===undefined){toast(t.dataset.set==='creditDay'?'Jour entre 1 et 28':'Valeur invalide');render();return}
  if(t.dataset.set)await w(()=>S.db.doc('settings/main').update({[t.dataset.set]:v}),'Enregistré');
  else if(t.dataset.pid)await w(()=>S.db.doc('people/'+t.dataset.pid).update({[t.dataset.pf]:v}),'Enregistré');
});

/* ---------- version et mise à jour ---------- */
const APP_VERSION='v14 · 8 nov. 2026';
/* Vide la copie hors connexion (pas les données) et recharge la dernière version publiée. */
async function forceUpdate(btn){
  if(btn){btn.disabled=true;btn.textContent='Mise à jour…'}
  if(!navigator.onLine){toast('Pas de connexion : réessaie avec du réseau');if(btn){btn.disabled=false;btn.textContent='Mettre à jour l’appli'}return}
  try{
    if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){try{await r.unregister()}catch(e){}}}
    if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}
  }catch(e){}
  location.replace(location.pathname+'?maj='+Date.now()+'#reglages');
}

/* ---------- stockage sur le téléphone ---------- */
const LS_KEY='la-cagnotte-donnees',META_KEY='la-cagnotte-meta';
const COLS=['people','payments','expenses','projects','extras','moves','allocs','settings'];
function deepMerge(a,b){const out=Object.assign({},a);for(const k of Object.keys(b)){const v=b[k];out[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))?deepMerge(a[k],v):v}return out}
function makeLocalDB(){
  const clone=o=>JSON.parse(JSON.stringify(o));
  const load=()=>{try{const d=JSON.parse(localStorage.getItem(LS_KEY)||'null');return d&&typeof d==='object'?d:{}}catch(e){return {}}};
  let data=load();const subs=new Set();
  const save=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(data))}catch(e){throw {code:'quota_exceeded',message:String(e)}}};
  const emit=()=>subs.forEach(f=>{try{f()}catch(e){console.error(e)}});
  const sub=f=>{subs.add(f);setTimeout(f,0);return ()=>subs.delete(f)};
  const parts=path=>{const p=String(path).split('/');if(p.length!==2||!p[0]||!p[1])throw new TypeError('Chemin invalide : '+path);return p};
  window.addEventListener('storage',e=>{if(e.key===LS_KEY){data=load();emit()}});
  return {
    doc(path){const [col,id]=parts(path);return {
      set:async v=>{(data[col]=data[col]||{})[id]=clone(v);save();emit()},
      update:async v=>{const cur=data[col]&&data[col][id];if(!cur)throw {code:'invalid_argument',message:'Document absent'};data[col][id]=deepMerge(cur,clone(v));save();emit()},
      delete:async()=>{if(data[col]&&data[col][id]){delete data[col][id];save();emit()}},
      onSnapshot:next=>sub(()=>{const d=data[col]&&data[col][id];next({id,exists:!!d,data:()=>d?clone(d):undefined})})
    }},
    collection(col){return {onSnapshot:next=>sub(()=>next({docs:Object.keys(data[col]||{}).map(id=>({id,exists:true,data:()=>clone(data[col][id])}))}))}},
    dump:()=>clone(data),
    replace:d=>{data=clone(d);save();emit()}
  };
}
function getMeta(){try{return JSON.parse(localStorage.getItem(META_KEY)||'{}')||{}}catch(e){return {}}}
function setMeta(m){try{localStorage.setItem(META_KEY,JSON.stringify(Object.assign(getMeta(),m)))}catch(e){}}
function lastBackupText(){const t=getMeta().lastBackup;return t?'Dernière sauvegarde '+fmtDateTime(t)+'.':'Aucune sauvegarde pour l’instant.'}
function backupWarn(){
  if(!S.settings)return '';
  const t=getMeta().lastBackup,days=t?(Date.now()-new Date(t).getTime())/864e5:Infinity;
  if(days<30)return '';
  return `<p class="warn" style="margin:0">${t?'Dernière sauvegarde il y a '+Math.floor(days)+' jours.':'Aucune sauvegarde pour l’instant.'} <button class="linkbtn" data-act="backup">Sauvegarder maintenant</button></p>`;
}
async function shareFile(blob,name,title){
  try{
    const file=new File([blob],name,{type:blob.type||'application/octet-stream'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title});return true}
      catch(e){if(e&&e.name==='AbortError')return false}
    }
  }catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  return true;
}
async function exportBackup(){
  const payload={app:'la-cagnotte',version:1,exportedAt:new Date().toISOString(),data:S.db.dump()};
  const blob=new Blob([JSON.stringify(payload,null,1)],{type:'application/json'});
  const ok=await shareFile(blob,`cagnotte-sauvegarde-${todayStr()}.json`,'Sauvegarde La Cagnotte');
  if(ok){setMeta({lastBackup:new Date().toISOString()});render();toast('Sauvegarde prête')}
}
function pickImport(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.addEventListener('change',()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    const fr=new FileReader();
    fr.onload=()=>{
      let p;try{p=JSON.parse(fr.result)}catch(e){toast('Ce fichier n’est pas une sauvegarde valide');return}
      const d=p&&p.data;
      if(!d||typeof d!=='object'||!d.settings||!d.settings.main){toast('Ce fichier n’est pas une sauvegarde de La Cagnotte');return}
      sheetImport(d,p.exportedAt);
    };
    fr.readAsText(f);
  });
  inp.click();
}
function sheetImport(d,at){
  const n=k=>Object.keys(d[k]||{}).length,has=!!S.settings;
  openSheet({
    render(){return `<h3>Importer les données</h3>
      <p class="lead">Fichier${at?' du '+fmtDateTime(at).replace(/^le /,''):''} : ${n('people')} cotisants, ${n('payments')} versements, ${n('projects')} projets, ${n('expenses')} dépenses.</p>
      ${has?`<p class="warn" style="margin:0 0 12px">Les données actuelles de ce téléphone seront remplacées.</p>`:''}
      <div class="actions"><button class="btn block" data-act="im-ok">${has?'Remplacer et importer':'Importer'}</button></div>`},
    act:{'im-ok':()=>{
      const clean={};COLS.forEach(k=>{if(d[k]&&typeof d[k]==='object')clean[k]=d[k]});
      S.db.replace(clean);setMeta({lastBackup:at||null});closeSheet();toast('Données importées');
      if(location.hash&&location.hash!=='#accueil')location.hash='accueil';
    }}});
}

/* ---------- boot ---------- */
function boot(){
  if(/[?&]maj=/.test(location.search)){try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}setTimeout(()=>toast('Appli à jour : '+APP_VERSION),400)}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  S.db=makeLocalDB();S.canWrite=true;
  render();
  const done=k=>{S.ready[k]=true;if(allReady())S.status='ok';refresh()};
  const toMap=snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=Object.assign({id:d.id},d.data())});return o};
  const db=S.db;
  db.collection('people').onSnapshot(s=>{S.people=toMap(s);done('p')});
  db.collection('payments').onSnapshot(s=>{S.payments=toMap(s);done('pay')});
  db.collection('expenses').onSnapshot(s=>{S.expenses=toMap(s);done('e')});
  db.collection('projects').onSnapshot(s=>{S.projects=toMap(s);done('pr')});
  db.collection('extras').onSnapshot(s=>{S.extras=toMap(s);done('x')});
  db.collection('moves').onSnapshot(s=>{S.moves=toMap(s);done('m')});
  db.collection('allocs').onSnapshot(s=>{S.allocs=toMap(s);done('a')});
  db.doc('settings/main').onSnapshot(d=>{S.settings=d.exists?Object.assign({},d.data()):null;done('s')});
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}

boot();
</script>
